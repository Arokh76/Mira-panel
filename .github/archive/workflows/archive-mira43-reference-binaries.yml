name: Mira 4.3C - archive les firmwares de reference
on:
  workflow_dispatch:
  push:
    branches: [firmware-beta]
    paths:
      - '.github/workflows/archive-mira43-reference-binaries.yml'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact 4.3C source-matched build artifact
        uses: actions/download-artifact@v4
        with:
          name: MIRA_0_7_37_UI_LVGL96_4_3C_FACTORY_OTA
          run-id: 42285250664
          github-token: ${{ github.token }}
          path: /tmp/mira43-ref
      - name: Verify both binaries and archive their exact bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,shutil
          files={
            "Mira_LVGL96_43C_UI_OTA.bin":"407f1199bdf99b5b78791502056333478b89e0d4b2019d22a7664047feaba6c6",
            "Mira_LVGL96_43C_UI_FACTORY_USB_0x0.bin":"eaf47411bb3ae8ac091b1cd52b5a823da45bd904a01f0afe92e7f5debcb7a5f0"
          }
          for name,expected in files.items():
            src=Path("/tmp/mira43-ref")/name
            data=src.read_bytes()
            sha=hashlib.sha256(data).hexdigest()
            if sha!=expected: raise RuntimeError(f"Checksum mismatch {name}: {sha}")
            out=Path("esp-idf-4.3C/bin")/name
            out.parent.mkdir(parents=True,exist_ok=True)
            shutil.copyfile(src,out)
            print(out,len(data),sha)
          PY
      - name: Commit original OTA and USB firmware to firmware-beta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esp-idf-4.3C/bin/*.bin
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(beta): archiver OTA et FACTORY 4.3C du build IDF original"
          git pull --rebase origin firmware-beta
          git push origin HEAD:firmware-beta
