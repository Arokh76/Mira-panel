name: Build Mira Panel 0.6.21 preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-preview-066.yml'
      - 'firmware/scripts/v0.6.6.py'
      - 'firmware/scripts/v0.6.7.py'
      - 'firmware/scripts/v0.6.8.py'
      - 'firmware/scripts/v0.6.9.py'
      - 'firmware/scripts/v0.6.10.py'
      - 'firmware/scripts/v0.6.11.py'
      - 'firmware/scripts/v0.6.12.py'
      - 'firmware/scripts/v0.6.13.py'
      - 'firmware/scripts/v0.6.14.py'
      - 'firmware/scripts/v0.6.15.py'
      - 'firmware/scripts/v0.6.16.py'
      - 'firmware/scripts/v0.6.17.py'
      - 'firmware/scripts/v0.6.17_fontfix.py'
      - 'firmware/scripts/v0.6.18.py'
      - 'firmware/scripts/v0.6.19.py'
      - 'firmware/scripts/v0.6.20.py'
      - 'firmware/scripts/v0.6.21.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct stable 0.6.5 sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf firmware/source/work
          mkdir -p firmware/source/work
          unzip -q firmware/source/Mira_Panel_Source_V0.4.3.zip -d firmware/source/work
          test -f firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
          test -f firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          if [ -d firmware/overrides/MIRA_PANEL ]; then cp -a firmware/overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/; fi
          for p in current.patch ota-safety.patch v0.4.5.patch v0.4.6.patch v0.4.7.patch; do
            if [ -s "firmware/patches/$p" ]; then (cd firmware/source/work/MIRA_PANEL && patch --batch --forward -p0 < "../../../patches/$p"); fi
          done
          if [ -d firmware/final-overrides/MIRA_PANEL ]; then cp -a firmware/final-overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/; fi
          for s in v0.4.8.py v0.4.9.py v0.4.10.py v0.4.11.py v0.5.0.py v0.5.0_ota_sync.py v0.5.1.py v0.5.2.py v0.5.3.py v0.5.4.py v0.5.5.py v0.5.6.py v0.5.7.py v0.5.8.py v0.5.9.py v0.5.10.py v0.5.11.py v0.5.12.py v0.5.13.py; do python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL; done
          python3 firmware/scripts/v0.6.0_runner.py firmware/source/work/MIRA_PANEL
          for s in v0.6.1.py v0.6.2.py v0.6.3.py v0.6.4.py v0.6.5.py; do python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL; done
          cp firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp /tmp/MiraPanelServer.before
          cp firmware/source/work/MIRA_PANEL/MiraMqtt.cpp /tmp/MiraMqtt.before
          cp firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp /tmp/MiraPanelUI.before

      - name: Apply 0.6.6 to 0.6.21 preview fixes
        shell: bash
        run: |
          set -euo pipefail
          for s in v0.6.6.py v0.6.7.py v0.6.8.py v0.6.9.py v0.6.10.py v0.6.11.py v0.6.12.py v0.6.13.py v0.6.14.py v0.6.15.py v0.6.16.py v0.6.17.py v0.6.17_fontfix.py v0.6.18.py v0.6.19.py v0.6.20.py v0.6.21.py; do python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL; done
          grep -q '"0.6.21"' firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
          grep -q 'waitDMA' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'MIRA_DRAW_BUFFER_LINES 32' firmware/source/work/MIRA_PANEL/MiraDisplayProfile.h
          grep -q 'server.on("/programui", HTTP_POST' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          ! grep -q 'lv_obj_fade_in(_pages\[i\], 160' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          ! grep -q 'lv_obj_fade_in(b.card' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'LVGL_LayoutX = -1' firmware/source/work/MIRA_PANEL/SPIFFS_Process.h
          grep -q 'lvgl_array\["lx"\]' firmware/source/work/MIRA_PANEL/SPIFFS_Process.h
          grep -q 'LV_OBJ_FLAG_IGNORE_LAYOUT' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'DynamicJsonDocument doc(16384)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'displayInfo\["freeLayout"\] = true' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -q 'MIRA_DISPLAY_PROFILE_ID "wt32-sc01-plus"' firmware/source/work/MIRA_PANEL/MiraDisplayProfile.h
          grep -q 'MIRA_DISPLAY_WIDTH 320' firmware/source/work/MIRA_PANEL/MiraDisplayProfile.h
          grep -q 'MIRA_LAYOUT_LOGICAL_WIDTH 1000' firmware/source/work/MIRA_PANEL/MiraDisplayProfile.h
          grep -q 'server.on("/displayinfo"' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -q 'displayInfo\["httpPrimary"\] = true' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -q 'dispDrv.hor_res = MIRA_DISPLAY_WIDTH' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'String LVGL_Layout = "auto";' firmware/source/work/MIRA_PANEL/SPIFFS_Process.h
          grep -q 'lvgl_array\["layout"\]' firmware/source/work/MIRA_PANEL/SPIFFS_Process.h
          grep -q 'request->hasParam("layout")' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -q 'String layout = "auto";' firmware/source/work/MIRA_PANEL/MiraPanelUI.h
          grep -q 'b.layout = widgetLayout;' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'forcedTile' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'forcedWide' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'forcedHero' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q '&lv_font_montserrat_28' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          ! grep -q 'lv_font_montserrat_32' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'LV_FLEX_FLOW_ROW_WRAP' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'if (i == 1 || i == 2) lv_obj_set_style_pad_top(_pages\[i\], 8, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'lv_obj_set_scrollbar_mode(b.card, LV_SCROLLBAR_MODE_OFF);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'DynamicJsonDocument mira_Json_LVGL(16384);' firmware/source/work/MIRA_PANEL/SPIFFS_Process.h
          grep -q 'document LVGL sature' firmware/source/work/MIRA_PANEL/SPIFFS_Process.h
          cmp /tmp/MiraMqtt.before firmware/source/work/MIRA_PANEL/MiraMqtt.cpp
          echo 'Files changed by visual/layout pass:'
          diff -q /tmp/MiraPanelUI.before firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp || true
          diff -q /tmp/MiraPanelServer.before firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp || true

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 2.0.17
        shell: bash
        run: |
          set -e
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          ok=0
          for attempt in 1 2 3; do
            if arduino-cli core install esp32:esp32@2.0.17; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" -eq 1

      - name: Install Arduino libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@8.3.11"
          arduino-cli lib install "LovyanGFX@1.1.9"
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "AsyncTCP@1.1.4"
          arduino-cli lib install "AsyncHTTPRequest_Generic@1.13.0"
          CW="$HOME/Arduino/libraries/lvgl/src/extra/widgets/colorwheel/lv_colorwheel.c"
          test -f "$CW"
          grep -q '#define LV_CPICKER_DEF_QF 3' "$CW"
          grep -q 'line_dsc.width += 2;' "$CW"
          sed -i 's/line_dsc.width += 2;/line_dsc.width += 4;/' "$CW"

      - name: Install Mira LVGL configuration
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          cp firmware/source/work/MIRA_PANEL/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"

      - name: Compile 0.6.21 preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled,UploadMode=default,USBMode=hwcdc" \
            --output-dir build \
            firmware/source/work/MIRA_PANEL
          test -s build/MIRA_PANEL.ino.bin
          strings build/MIRA_PANEL.ino.bin | grep -Fxq '0.6.21'
          ls -lh build/*.bin
          sha256sum build/MIRA_PANEL.ino.bin

      - name: Upload preview firmware
        uses: actions/upload-artifact@v4
        with:
          name: Mira_Panel_0.6.21_preview
          path: build/MIRA_PANEL.ino.bin
          if-no-files-found: error
          retention-days: 14
