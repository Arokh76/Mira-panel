name: Publish Mira Panel firmware

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest successful firmware artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow build-firmware.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Aucun build Mira Panel réussi trouvé."
            exit 1
          fi

          echo "Utilisation du build GitHub Actions #$RUN_ID"
          rm -rf artifact
          mkdir -p artifact
          gh run download "$RUN_ID" --name Mira_Panel_firmware --dir artifact
          test -f artifact/MIRA_PANEL.ino.bin

      - name: Prepare OTA binary
        run: |
          cp artifact/MIRA_PANEL.ino.bin firmware/Mira_Panel.bin
          ls -lh firmware/Mira_Panel.bin
          sha256sum firmware/Mira_Panel.bin

      - name: Publish firmware on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/Mira_Panel.bin

          if git diff --cached --quiet; then
            echo "Le binaire publié est déjà à jour."
            exit 0
          fi

          git commit -m "Publish Mira Panel firmware 0.4.2"
          git push origin HEAD:main
