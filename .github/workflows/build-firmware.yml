name: Build Mira Panel firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-firmware.yml'
      - 'firmware/source/Mira_Panel_Source_V0.4.3.zip'
      - 'firmware/patches/current.patch'
      - 'firmware/patches/ota-safety.patch'
      - 'firmware/patches/v0.4.5.patch'
      - 'firmware/patches/v0.4.6.patch'
      - 'firmware/patches/v0.4.7.patch'
      - 'firmware/overrides/**'
      - 'firmware/final-overrides/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Mira Panel sources
        run: |
          test -f firmware/source/Mira_Panel_Source_V0.4.3.zip
          rm -rf firmware/source/work
          mkdir -p firmware/source/work
          unzip -q firmware/source/Mira_Panel_Source_V0.4.3.zip -d firmware/source/work
          test -f firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
          test -f firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp

          if [ -d firmware/overrides/MIRA_PANEL ]; then
            echo "Applying Mira source overrides"
            cp -a firmware/overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          fi

          if [ -s firmware/patches/current.patch ]; then
            echo "Applying current Mira patch"
            cd firmware/source/work/MIRA_PANEL
            patch --batch --forward -p0 < ../../../patches/current.patch
            cd ../../../..
          fi

          if [ -s firmware/patches/ota-safety.patch ]; then
            echo "Applying OTA safety patch"
            cd firmware/source/work/MIRA_PANEL
            patch --batch --forward -p0 < ../../../patches/ota-safety.patch
            cd ../../../..
          fi

          if [ -s firmware/patches/v0.4.5.patch ]; then
            echo "Applying Mira Panel 0.4.5 patch"
            cd firmware/source/work/MIRA_PANEL
            patch --batch --forward -p0 < ../../../patches/v0.4.5.patch
            cd ../../../..
          fi

          if [ -s firmware/patches/v0.4.6.patch ]; then
            echo "Applying Mira Panel 0.4.6 patch"
            cd firmware/source/work/MIRA_PANEL
            patch --batch --forward -p0 < ../../../patches/v0.4.6.patch
            cd ../../../..
          fi

          if [ -s firmware/patches/v0.4.7.patch ]; then
            echo "Applying Mira Panel 0.4.7 patch"
            cd firmware/source/work/MIRA_PANEL
            patch --batch --forward -p0 < ../../../patches/v0.4.7.patch
            cd ../../../..
          fi

          if [ -d firmware/final-overrides/MIRA_PANEL ]; then
            echo "Applying final Mira source overrides"
            cp -a firmware/final-overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          fi

          grep -q '"0.4.7"' firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
          grep -q 'MiraPanelServer::SetupModule' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -q 'MiraPanelServer::IndexSetEvent' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -q 'MiraPanelServer::IsUpdateInProgress' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -q 'miraManualUpdateSucceeded' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -q 'Configuration · étape 1/2' firmware/source/work/MIRA_PANEL/HTML/HTML_Key.h
          grep -q 'Configuration · étape 2/2' firmware/source/work/MIRA_PANEL/HTML/HTML_ManageurWiFiSansR.h
          grep -q 'Vérification effectuée par ton navigateur' firmware/source/work/MIRA_PANEL/HTML/HTML_Sys.h
          grep -q 'uploadBlob' firmware/source/work/MIRA_PANEL/HTML/HTML_Sys.h

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 2.0.17
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install Arduino libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@8.3.11"
          arduino-cli lib install "LovyanGFX@1.1.9"
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "AsyncTCP@1.1.4"
          arduino-cli lib install "AsyncHTTPRequest_Generic@1.13.0"

      - name: Install Mira LVGL configuration
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          cp firmware/source/work/MIRA_PANEL/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"

      - name: Compile Mira Panel
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled,UploadMode=default,USBMode=hwcdc" \
            --output-dir build \
            firmware/source/work/MIRA_PANEL

      - name: Show generated files
        run: ls -lah build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mira_Panel_firmware
          path: build/*.bin
          if-no-files-found: error
          retention-days: 14
