name: Build Mira Panel firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-firmware.yml'
      - 'firmware/source/Mira_Panel_Source_V0.4.3.zip'
      - 'firmware/patches/current.patch'
      - 'firmware/patches/ota-safety.patch'
      - 'firmware/patches/v0.4.5.patch'
      - 'firmware/patches/v0.4.6.patch'
      - 'firmware/patches/v0.4.7.patch'
      - 'firmware/scripts/v0.4.8.py'
      - 'firmware/scripts/v0.4.9.py'
      - 'firmware/scripts/v0.4.10.py'
      - 'firmware/scripts/v0.4.11.py'
      - 'firmware/scripts/v0.5.0.py'
      - 'firmware/scripts/v0.5.0_ota_sync.py'
      - 'firmware/scripts/v0.5.1.py'
      - 'firmware/scripts/v0.5.2.py'
      - 'firmware/scripts/v0.5.3.py'
      - 'firmware/scripts/v0.5.4.py'
      - 'firmware/scripts/v0.5.5.py'
      - 'firmware/scripts/v0.5.6.py'
      - 'firmware/scripts/v0.5.7.py'
      - 'firmware/scripts/v0.5.8.py'
      - 'firmware/scripts/v0.5.9.py'
      - 'firmware/scripts/v0.5.10.py'
      - 'firmware/scripts/v0.5.11.py'
      - 'firmware/scripts/v0.5.12.py'
      - 'firmware/scripts/v0.5.13.py'
      - 'firmware/scripts/v0.6.0.py'
      - 'firmware/scripts/v0.6.0_runner.py'
      - 'firmware/scripts/v0.6.1.py'
      - 'firmware/scripts/v0.6.2.py'
      - 'firmware/scripts/v0.6.3.py'
      - 'firmware/scripts/v0.6.4.py'
      - 'firmware/scripts/v0.6.5.py'
      - 'firmware/overrides/**'
      - 'firmware/final-overrides/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Mira Panel sources
        shell: bash
        run: |
          set -euo pipefail
          test -f firmware/source/Mira_Panel_Source_V0.4.3.zip
          rm -rf firmware/source/work
          mkdir -p firmware/source/work
          unzip -q firmware/source/Mira_Panel_Source_V0.4.3.zip -d firmware/source/work
          test -f firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
          test -f firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp

          if [ -d firmware/overrides/MIRA_PANEL ]; then
            echo "Applying Mira source overrides"
            cp -a firmware/overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          fi

          for p in current.patch ota-safety.patch v0.4.5.patch v0.4.6.patch v0.4.7.patch; do
            if [ -s "firmware/patches/$p" ]; then
              echo "Applying $p"
              (cd firmware/source/work/MIRA_PANEL && patch --batch --forward -p0 < "../../../patches/$p")
            fi
          done

          if [ -d firmware/final-overrides/MIRA_PANEL ]; then
            echo "Applying final Mira source overrides"
            cp -a firmware/final-overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          fi

          for s in \
            v0.4.8.py v0.4.9.py v0.4.10.py v0.4.11.py \
            v0.5.0.py v0.5.0_ota_sync.py v0.5.1.py v0.5.2.py v0.5.3.py \
            v0.5.4.py v0.5.5.py v0.5.6.py v0.5.7.py v0.5.8.py v0.5.9.py \
            v0.5.10.py v0.5.11.py v0.5.12.py v0.5.13.py; do
            echo "Applying $s"
            python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL
          done
          echo "Applying v0.6.0.py through compatibility runner"
          python3 firmware/scripts/v0.6.0_runner.py firmware/source/work/MIRA_PANEL
          for s in v0.6.1.py v0.6.2.py v0.6.3.py v0.6.4.py v0.6.5.py; do
            echo "Applying $s"
            python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL
          done

          grep -q '"0.6.5"' firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
          grep -q 'server.on("/display-save", HTTP_POST' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -q 'DISPLAY_NuitAuto_Check' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -q 'action="/display-save"' firmware/source/work/MIRA_PANEL/HTML/HTML_Parametres.h
          grep -q 'name="DISPLAY_DebutNuit" type="time"' firmware/source/work/MIRA_PANEL/HTML/HTML_Parametres.h
          grep -q 'name="DISPLAY_FinNuit" type="time"' firmware/source/work/MIRA_PANEL/HTML/HTML_Parametres.h
          grep -q '_syncingDisplayControls' firmware/source/work/MIRA_PANEL/MiraPanelUI.h
          grep -q 'time_t epoch = time(nullptr);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'localtime_r(&epoch, &t);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q '_lastScheduleCheckMs) < 1000UL' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'float IndexGetRange(int ID);' firmware/source/work/MIRA_PANEL/MiraPanelServer.h
          grep -q 'const float setpoint = rawValue \* 0.5f;' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'lv_colorwheel_set_mode_fixed(b.control, true)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 2.0.17
        shell: bash
        run: |
          set -e
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          ok=0
          for attempt in 1 2 3; do
            echo "ESP32 core install attempt $attempt/3"
            if arduino-cli core install esp32:esp32@2.0.17; then
              ok=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "$ok" -eq 1

      - name: Install Arduino libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@8.3.11"
          arduino-cli lib install "LovyanGFX@1.1.9"
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "AsyncTCP@1.1.4"
          arduino-cli lib install "AsyncHTTPRequest_Generic@1.13.0"

          CW="$HOME/Arduino/libraries/lvgl/src/extra/widgets/colorwheel/lv_colorwheel.c"
          test -f "$CW"
          grep -q '#define LV_CPICKER_DEF_QF 3' "$CW"
          grep -q 'line_dsc.width += 2;' "$CW"
          sed -i 's/line_dsc.width += 2;/line_dsc.width += 4;/' "$CW"
          grep -q 'line_dsc.width += 4;' "$CW"

      - name: Install Mira LVGL configuration
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          cp firmware/source/work/MIRA_PANEL/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"

      - name: Compile Mira Panel
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled,UploadMode=default,USBMode=hwcdc" \
            --output-dir build \
            firmware/source/work/MIRA_PANEL

      - name: Create Web Installer factory image
        shell: bash
        run: |
          set -euo pipefail

          CORE="$HOME/.arduino15/packages/esp32/hardware/esp32/2.0.17"
          BOOT_APP0="$CORE/tools/partitions/boot_app0.bin"
          test -f "$BOOT_APP0"
          test -f build/MIRA_PANEL.ino.bootloader.bin
          test -f build/MIRA_PANEL.ino.partitions.bin
          test -f build/MIRA_PANEL.ino.bin

          ESPTOOL_DIR=$(find "$HOME/.arduino15/packages/esp32/tools/esptool_py" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ -x "$ESPTOOL_DIR/esptool" ]; then
            ESPTOOL="$ESPTOOL_DIR/esptool"
            "$ESPTOOL" --chip esp32s3 merge_bin \
              -o build/Mira_Panel_Factory.bin \
              --flash_mode dio --flash_freq 80m --flash_size 8MB \
              0x0 build/MIRA_PANEL.ino.bootloader.bin \
              0x8000 build/MIRA_PANEL.ino.partitions.bin \
              0xe000 "$BOOT_APP0" \
              0x10000 build/MIRA_PANEL.ino.bin
          elif [ -f "$ESPTOOL_DIR/esptool.py" ]; then
            python3 "$ESPTOOL_DIR/esptool.py" --chip esp32s3 merge_bin \
              -o build/Mira_Panel_Factory.bin \
              --flash_mode dio --flash_freq 80m --flash_size 8MB \
              0x0 build/MIRA_PANEL.ino.bootloader.bin \
              0x8000 build/MIRA_PANEL.ino.partitions.bin \
              0xe000 "$BOOT_APP0" \
              0x10000 build/MIRA_PANEL.ino.bin
          else
            echo "esptool introuvable dans $ESPTOOL_DIR"
            exit 1
          fi

          test -s build/Mira_Panel_Factory.bin
          strings build/Mira_Panel_Factory.bin | grep -Fxq "0.6.5"
          echo "Factory image ready:"
          ls -lh build/Mira_Panel_Factory.bin
          sha256sum build/Mira_Panel_Factory.bin

      - name: Show generated files
        run: ls -lah build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mira_Panel_firmware
          path: build/*.bin
          if-no-files-found: error
          retention-days: 14
