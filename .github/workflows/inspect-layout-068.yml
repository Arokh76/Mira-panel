name: Inspect Mira Panel layout 0.6.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-layout-068.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct 0.6.7 preview sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf firmware/source/work
          mkdir -p firmware/source/work
          unzip -q firmware/source/Mira_Panel_Source_V0.4.3.zip -d firmware/source/work
          cp -a firmware/overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          for p in current.patch ota-safety.patch v0.4.5.patch v0.4.6.patch v0.4.7.patch; do
            if [ -s "firmware/patches/$p" ]; then
              (cd firmware/source/work/MIRA_PANEL && patch --batch --forward -p0 < "../../../patches/$p")
            fi
          done
          if [ -d firmware/final-overrides/MIRA_PANEL ]; then cp -a firmware/final-overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/; fi
          for s in v0.4.8.py v0.4.9.py v0.4.10.py v0.4.11.py v0.5.0.py v0.5.0_ota_sync.py v0.5.1.py v0.5.2.py v0.5.3.py v0.5.4.py v0.5.5.py v0.5.6.py v0.5.7.py v0.5.8.py v0.5.9.py v0.5.10.py v0.5.11.py v0.5.12.py v0.5.13.py; do python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL; done
          python3 firmware/scripts/v0.6.0_runner.py firmware/source/work/MIRA_PANEL
          for s in v0.6.1.py v0.6.2.py v0.6.3.py v0.6.4.py v0.6.5.py v0.6.6.py v0.6.7.py; do python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL; done

      - name: Inspect dynamic dashboard layout points
        shell: bash
        run: |
          set -euo pipefail
          UI=firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          HDR=firmware/source/work/MIRA_PANEL/MiraPanelUI.h
          echo '===== BUILD JSON ====='
          L=$(grep -n 'void MiraPanelUI::buildFromMiraJson' "$UI" | cut -d: -f1); sed -n "$L,$((L+180))p" "$UI"
          echo '===== MAKE CARD ====='
          L=$(grep -n 'lv_obj_t\* MiraPanelUI::makeCard' "$UI" | cut -d: -f1); sed -n "$L,$((L+80))p" "$UI"
          echo '===== INFO ====='
          L=$(grep -n 'void MiraPanelUI::createInfo' "$UI" | cut -d: -f1); sed -n "$L,$((L+120))p" "$UI"
          echo '===== DATETIME ====='
          L=$(grep -n 'void MiraPanelUI::createDateTime' "$UI" | cut -d: -f1); sed -n "$L,$((L+120))p" "$UI"
          echo '===== BINDING ====='
          grep -n -A90 -B10 'struct Binding' "$HDR" || true
          echo '===== CREATE DISPATCH ====='
          grep -n -A70 -B20 'createInfo' "$UI" | head -160 || true
