name: Cleanup approved legacy Waveshare experiments
on:
  push:
    branches: [experiment/mira-idf-mira-ui-43c]
    paths: [.github/workflows/cleanup-approved-experiments.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Validate archived commits before deleting 15 legacy experiment refs
        uses: actions/github-script@v7
        env:
          TARGETS: '{"experiment/mira-0737-full-lvgl96-43c":"9af6dbe8dc77f8396883afccb736d76d9acb241b","experiment/waveshare-flatui-0.7.37":"2a0bac09588f4b157ea4b57c51b6ed24a4a99fb9","experiment/waveshare-lvgl96-probe":"1a6a99e2cf382eea43946d9fa2b832b599824bc3","experiment/waveshare-lvgl96-sram-partial":"90b0b2bad0c1d5567564a4143e85107b1a86a168","experiment/waveshare-lvgl-input10-0.7.37":"ddf426c08c84366beec328784fd192e4bd59adac","experiment/waveshare-lvgl-input10-render10-0.7.37":"c066d2897e8a9eeffe12a0e9fbec3a1c871a43e9","experiment/waveshare-nocache-0.7.37":"1b9145f57fc25b7b88fe39d108c54548be56170c","experiment/waveshare-perf-memcpy-0.7.37":"94b63f6b18ae270a41109e8e81229db023660185","experiment/waveshare-perf-metrics-0.7.37":"5bec59abf940131601803ebd5120dc6258b75326","experiment/waveshare-perf-nocomplex-0.7.37":"f7dfb83d622d6762f1ebeda35e30d3a322c4a49b","experiment/waveshare-perf-page-flat-0.7.37":"8571c777687b5f11663af6441a8789c82b9a5be5","experiment/waveshare-perf-stages-0.7.37":"83339eec04d92b0c79f1e45a83235a7ab67f60d0","experiment/waveshare-rgb14mhz-0.7.37":"60ea346f9ccef7b275901a2b2be36bec81e49a03","experiment/waveshare-rgb16mhz-0.7.37":"a4e2a207283d8425433cf9015e415b0c09f3df7f","experiment/waveshare-sram-partial-0.7.37":"0866834c4329a6138939a37a5b95aac32cfcb986"}'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo}=context.repo;
            const targets=JSON.parse(process.env.TARGETS);
            if(Object.keys(targets).length!==15)throw Error("Count mismatch");
            const a=await github.rest.repos.getBranch({owner,repo,branch:"archive/mira-preclean-20261101"});
            if(a.data.commit.sha!=="6c24a84edd9265dd89a05789e2b03a3b1de633b1")
              throw Error("Archive not on expected commit");
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const existing=new Map(branches.map(b=>[b.name,b.commit.sha]));
            for(const [name,sha] of Object.entries(targets)){
              if(!name.startsWith("experiment/") || name.startsWith("experiment/mira-idf-"))
                throw Error("Protected IDF ref "+name);
              if(existing.get(name)!==sha)throw Error("Branch mismatch "+name);
            }
            core.info("All experiment SHA checks passed. Removing only the 15 approved non-IDF references.");
            for(const name of Object.keys(targets)){
              await github.rest.git.deleteRef({owner,repo,ref:"heads/"+name});
              core.info("Deleted "+name);
            }
            core.notice("15 archived legacy experiment branches deleted.");
