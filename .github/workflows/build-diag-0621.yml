name: Build Mira 0.6.21 diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-diag-0621.yml'
      - 'firmware/scripts/diag_0621.py'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [test1, test2, test3]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct Mira 0.6.20 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf firmware/source/work
          mkdir -p firmware/source/work
          unzip -q firmware/source/Mira_Panel_Source_V0.4.3.zip -d firmware/source/work
          test -f firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino

          if [ -d firmware/overrides/MIRA_PANEL ]; then
            cp -a firmware/overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          fi

          for p in current.patch ota-safety.patch v0.4.5.patch v0.4.6.patch v0.4.7.patch; do
            if [ -s "firmware/patches/$p" ]; then
              (cd firmware/source/work/MIRA_PANEL && patch --batch --forward -p0 < "../../../patches/$p")
            fi
          done

          if [ -d firmware/final-overrides/MIRA_PANEL ]; then
            cp -a firmware/final-overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          fi

          for s in v0.4.8.py v0.4.9.py v0.4.10.py v0.4.11.py v0.5.0.py v0.5.0_ota_sync.py v0.5.1.py v0.5.2.py v0.5.3.py v0.5.4.py v0.5.5.py v0.5.6.py v0.5.7.py v0.5.8.py v0.5.9.py v0.5.10.py v0.5.11.py v0.5.12.py v0.5.13.py; do
            python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL
          done
          python3 firmware/scripts/v0.6.0_runner.py firmware/source/work/MIRA_PANEL
          for s in v0.6.1.py v0.6.2.py v0.6.3.py v0.6.4.py v0.6.5.py v0.6.6.py v0.6.7.py v0.6.8.py v0.6.9.py v0.6.10.py v0.6.11.py v0.6.12.py v0.6.13.py v0.6.14.py v0.6.15.py v0.6.16.py v0.6.17.py v0.6.17_fontfix.py v0.6.18.py v0.6.19.py v0.6.20.py; do
            python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL
          done
          grep -q '"0.6.20"' firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino

      - name: Apply diagnostic delta
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/scripts/diag_0621.py firmware/source/work/MIRA_PANEL "${{ matrix.variant }}"
          case "${{ matrix.variant }}" in
            test1)
              grep -q '"0.6.21-t1"' firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
              grep -q 'server.on("/programui", HTTP_POST' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
              ! grep -q 'waitDMA' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
              ! grep -q 'MIRA_DRAW_BUFFER_LINES 32' firmware/source/work/MIRA_PANEL/MiraDisplayProfile.h
              ;;
            test2)
              grep -q '"0.6.21-t2"' firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
              grep -q 'waitDMA' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
              ! grep -q 'MIRA_DRAW_BUFFER_LINES 32' firmware/source/work/MIRA_PANEL/MiraDisplayProfile.h
              ;;
            test3)
              grep -q '"0.6.21-t3"' firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
              grep -q 'waitDMA' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
              grep -q 'MIRA_DRAW_BUFFER_LINES 32' firmware/source/work/MIRA_PANEL/MiraDisplayProfile.h
              ;;
          esac

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 2.0.17
        shell: bash
        run: |
          set -e
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          ok=0
          for attempt in 1 2 3; do
            if arduino-cli core install esp32:esp32@2.0.17; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" -eq 1

      - name: Install Arduino libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@8.3.11"
          arduino-cli lib install "LovyanGFX@1.1.9"
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "AsyncTCP@1.1.4"
          arduino-cli lib install "AsyncHTTPRequest_Generic@1.13.0"
          CW="$HOME/Arduino/libraries/lvgl/src/extra/widgets/colorwheel/lv_colorwheel.c"
          sed -i 's/line_dsc.width += 2;/line_dsc.width += 4;/' "$CW"

      - name: Install Mira LVGL configuration
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          cp firmware/source/work/MIRA_PANEL/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"

      - name: Compile diagnostic firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled,UploadMode=default,USBMode=hwcdc" \
            --output-dir build \
            firmware/source/work/MIRA_PANEL
          test -s build/MIRA_PANEL.ino.bin
          cp build/MIRA_PANEL.ino.bin "build/Mira_Panel_0.6.21-${{ matrix.variant }}.bin"
          ls -lh build/Mira_Panel_0.6.21-*.bin
          sha256sum build/Mira_Panel_0.6.21-*.bin

      - name: Upload diagnostic firmware
        uses: actions/upload-artifact@v4
        with:
          name: Mira_Panel_0.6.21-${{ matrix.variant }}
          path: build/Mira_Panel_0.6.21-${{ matrix.variant }}.bin
          if-no-files-found: error
          retention-days: 14
