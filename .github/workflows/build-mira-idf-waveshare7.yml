name: BETA Mira 7 ESP-IDF — build de développement
on:
  push:
    branches:
      - firmware-beta
    paths:
      - '.github/workflows/build-mira-idf-waveshare7.yml'
      - 'esp-idf/**'
  workflow_dispatch:
  pull_request:
    branches: [firmware-beta]
    paths:
      - '.github/workflows/build-mira-idf-waveshare7.yml'
      - 'esp-idf/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged boot diagnostic
        uses: actions/checkout@v4
      - name: Checkout pinned LVGL 9.6.0
        uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: v9.6.0
          path: esp-idf/components/lvgl
          submodules: false
      - name: Verify UI-only diagnostics preserve network, storage and GPIO
        shell: bash
        run: |
          set -euo pipefail
          ROOT=esp-idf
          grep -Fq 'NETWORK_FAILED_HALT' "$ROOT/main/app_main.c"
          grep -Fq 'FIRST_SETUP_READY' "$ROOT/main/app_main.c"
          grep -Fq 'mira_splash_set_message' "$ROOT/main/mira_splash.c"
          grep -Fq 'conf.stack_size = setup_only?6144:7168' "$ROOT/main/mira_recovery.c"
          grep -Fq 'HTTPD_RESCUE_READY' "$ROOT/main/mira_recovery.c"
          grep -Fq 'HTTPD_PREFLIGHT' "$ROOT/main/mira_recovery.c"
          grep -Fq 'mira_recovery_web_fallback()' "$ROOT/main/app_main.c"
          grep -Fq 'MIRA_NO_WIDGETS_IDLE' "$ROOT/main/app_main.c"
          grep -Fq 'MIRA_WIDGET_CONFIG_FOUND' "$ROOT/main/app_main.c"
          grep -Fq 'stat("/spiffs/miralvgl.json"' "$ROOT/main/app_main.c"
          grep -Fq 'CLOCK_UI_ONLY_NO_SERVICES' "$ROOT/main/app_main.c"
          grep -Fq 'MIRA_UI_CREATION_BEGIN' "$ROOT/main/app_main.c"
          grep -Fq 'CLOCK_UI_PHASE 7:' "$ROOT/main/mira_full.c"
          grep -Fq 'CONFIG_LV_USE_CUSTOM_MALLOC=y' "$ROOT/sdkconfig.defaults"
          grep -Fq 'lv_malloc_core(size_t bytes)' "$ROOT/main/mira_lvgl_psram_malloc.c"
          grep -Fq 'MALLOC_CAP_SPIRAM|MALLOC_CAP_8BIT' "$ROOT/main/mira_lvgl_psram_malloc.c"
          grep -Fq 'mira_lvgl_psram_malloc.c' "$ROOT/main/CMakeLists.txt"
          grep -Fq 'JEEDOM_PASSIVE_PSRAM_READY' "$ROOT/main/mira_full.c"
          grep -Fq 'JEEDOM_PASSIVE_HTTP_READY' "$ROOT/main/mira_jeedom.c"
          grep -Fq 'MIRA_JEEDOM_PASSIVE_READY' "$ROOT/main/app_main.c"
          grep -Fq 'jeedom_passive_ready' "$ROOT/main/mira_recovery.c"
          grep -Fq 'CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM=y' "$ROOT/sdkconfig.defaults"
          grep -Fq 'xTaskCreateWithCaps(jeedom_action_worker' "$ROOT/main/mira_jeedom.c"
          grep -Fq 'xQueueCreateWithCaps(12,sizeof(mira_action_msg_t)' "$ROOT/main/mira_jeedom.c"
          grep -Fq 'MIRA_JEEDOM_ACTIONS_READY' "$ROOT/main/app_main.c"
          grep -Fq 'jeedom_actions_ready' "$ROOT/main/mira_recovery.c"
          ! grep -Eq '[[:space:]]mira_mqtt_init\\(' "$ROOT/main/app_main.c"
          ! grep -Eq '[[:space:]]mira_jeedom_action_init\\(' "$ROOT/main/app_main.c"
          ! grep -Eq '[[:space:]]mira_mqtt_init\\(' "$ROOT/main/app_main.c"
          grep -Fq 'CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=16384' "$ROOT/sdkconfig.defaults"
          ! grep -Eq 'mira_jeedom_action_init\\(' "$ROOT/main/app_main.c"
          ! grep -Eq 'mira_mqtt_init\\(' "$ROOT/main/app_main.c"
          grep -Fq 'mira_recovery_init()' "$ROOT/main/app_main.c"
          grep -Fq 'mira_full_storage_prepare()' "$ROOT/main/app_main.c"
          grep -Fq 'mira_beta_setup_register_minimal(httpd)' "$ROOT/main/mira_recovery.c"
          grep -Fq 'MIRA_SETUP_READY' "$ROOT/main/mira_recovery.c"
          grep -Fq 'CONFIG_SPIRAM_XIP_FROM_PSRAM=y' "$ROOT/sdkconfig.defaults"
          grep -Fq 'CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y' "$ROOT/sdkconfig.defaults"
          grep -Fq '#define LCD_BOUNCE_BUFFER_PIXELS (WIDTH * LCD_BOUNCE_BUFFER_LINES)' "$ROOT/main/mira_display.c"
          grep -Fq '#define LCD_PCLK_HZ (16 * 1000 * 1000)' "$ROOT/main/mira_display.c"
          grep -Fq 'const bool blank=spiffs_partition_is_blank();' "$ROOT/main/mira_full.c"
          grep -Fq '.format_if_mount_failed=blank' "$ROOT/main/mira_full.c"
          ! grep -Eq 'mira_net_diag_start|mira_camera_init\\(' "$ROOT/main/app_main.c"
          ! grep -Eq 'nvs_flash_erase|esp_vfs_spiffs_format' "$ROOT/main/app_main.c"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('esp-idf/main/app_main.c').read_text()
          assert p.index('mira_display_preallocate_rgb()') < p.index('mira_display_init()') < p.index('mira_recovery_init()') < p.index('mira_full_ui_create(mira_display_lvgl())')
          setup=Path('esp-idf/main/mira_beta_setup.c').read_text()
          web=Path('esp-idf/main/mira_beta_web.c').read_text()
          net=Path('esp-idf/main/mira_recovery.c').read_text()
          assert 'if(mira_beta_setup_runtime_configured())return false;' in setup
          assert 'if(mira_beta_setup_runtime_configured()||!mira_beta_setup_unconfigured())' in setup
          assert 'httpd_resp_set_status(req,"503 Service Unavailable")' in web
          assert 'httpd_resp_set_hdr(req,"Retry-After","5")' in web
          assert 'mira_beta_setup_mark_configured_runtime();' in net
          assert 'consecutive_setup_failures>=3u' in net
          assert 'setup_runtime_configured' in net and 'auth_read_failures' in net
          assert 'mira_beta_web_auth_key_init();' in net
          auth=web[web.index('bool mira_beta_web_authorized(httpd_req_t *req)'):web.index('static int hexval(')]
          assert 'nvs_open(' not in auth and 'nvs_get_str(' not in auth
          assert 'mira_beta_web_auth_key_copy(key,sizeof(key))' in auth
          assert 'return mira_beta_web_auth_key_present();' in setup
          assert 'mira_beta_web_auth_key_set(key);' in setup
          assert 'mira_beta_web_auth_key_set(password);' in net
          assert 'auth_cached' in net
          jeed=Path('esp-idf/main/mira_jeedom.c').read_text()
          assert 'mira_beta_web_auth_key_set(key->valuestring);' in jeed
          assert 'mira_beta_web_auth_key_set(plaintext);' in jeed
          PY
      - name: Native ESP-IDF 5.5.6 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          path: esp-idf
          command: idf.py build
      - name: Package one application-only browser OTA firmware
        shell: bash
        run: |
          set -euo pipefail
          ROOT=esp-idf/build
          mkdir -p mira7_ota
          cp "$ROOT/mira_idf_7std.bin" mira7_ota/MIRA7_IDF_DEV_OTA.bin
          python3 - <<'PY'
          from pathlib import Path
          path=Path("mira7_ota/MIRA7_IDF_DEV_OTA.bin")
          data=path.read_bytes()
          assert len(data)>65536 and len(data)<=0x300000, "OTA image exceeds app slot"
          assert data[0]==0xE9, "Not an ESP app image"
          print("OTA only:",len(data),"bytes; no bootloader, NVS or SPIFFS")
          PY
      - name: Upload development OTA (not the frozen HTTP24K reference)
        uses: actions/upload-artifact@v4
        with:
          name: MIRA7_IDF_DEV_OTA
          path: mira7_ota/MIRA7_IDF_DEV_OTA.bin
          retention-days: 30
          if-no-files-found: error
