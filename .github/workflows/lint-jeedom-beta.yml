name: Mira Jeedom beta - PHP and JS validation
on:
  push:
    branches: [beta]
    paths:
      - "core/**"
      - "desktop/**"
      - "plugin_info/**"
      - ".github/workflows/lint-jeedom-beta.yml"
  pull_request:
    branches: [beta]
    paths:
      - "core/**"
      - "desktop/**"
      - "plugin_info/**"
      - ".github/workflows/lint-jeedom-beta.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          php -l core/class/mira.class.php
          php -l core/ajax/mira.ajax.php
          php -l desktop/php/mira.php
      - name: Check JavaScript syntax
        run: node --check desktop/js/mira.js
      - name: Regression test composite widget autosync
        run: php tests/test_autosync_composite.php
      - name: Check energy numeric formatting
        run: php tests/test_energy_precision.php
      - name: Check unique multimedia command names
        run: php tests/test_media_unique_names.php
      - name: Check French Energy and Media labels
        run: php tests/test_media_energy_french_names.php
      - name: Check no duplicate Spotify Connect sources
        run: php tests/test_spotify_source_menu.php
      - name: Check Spotify range routing and read-only refresh
        run: php tests/test_media_volume_routing.php
      - name: Check separate Play and Pause actions
        run: php tests/test_media_two_actions.php
      - name: Check runtime Spotify speaker switching
        run: php tests/test_spotify_speaker_switch.php
      - name: Check Spotify playback-state discovery
        run: php tests/test_spotify_playback_state.php
      - name: Check asynchronous Spotify event listener
        run: php tests/test_media_async_listener.php
      - name: Check Spotify burst coalescing and changed-only delivery
        run: php tests/test_media_burst_delivery.php
      - name: Verify native Multimedia page and Spotify mapping
        shell: bash
        run: |
          grep -Fq 'value="multimedia"' desktop/php/mira.php
          grep -Fq 'data-page="multimedia"' desktop/php/mira.php
          grep -Fq 'media_source_eqid' desktop/php/mira.php
          grep -Fq 'pushVisiblePages' core/class/mira.class.php
          grep -Fq 'rebuildMediaListener' core/class/mira.class.php
          grep -Fq 'onMediaSourceEvent' core/class/mira.class.php
          grep -Fq 'mira_media_play_cmd' core/class/mira.class.php
          grep -Fq 'mira_media_source_cmd' desktop/js/mira.js
      - name: Verify Multi-actions integration
        shell: bash
        run: |
          grep -Fq 'Bouton multi-actions' desktop/php/mira.php
          grep -Fq 'mira_input_gpio' desktop/js/mira.js
          grep -Fq '/gpio/multi/config' core/class/mira.class.php
          grep -Fq "type === 'multiaction'" core/ajax/mira.ajax.php
