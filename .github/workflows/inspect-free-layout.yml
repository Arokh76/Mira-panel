name: Inspect Mira free-layout foundation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-free-layout.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct 0.6.17 sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf firmware/source/work && mkdir -p firmware/source/work
          unzip -q firmware/source/Mira_Panel_Source_V0.4.3.zip -d firmware/source/work
          cp -a firmware/overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          for p in current.patch ota-safety.patch v0.4.5.patch v0.4.6.patch v0.4.7.patch; do
            if [ -s "firmware/patches/$p" ]; then (cd firmware/source/work/MIRA_PANEL && patch --batch --forward -p0 < "../../../patches/$p"); fi
          done
          if [ -d firmware/final-overrides/MIRA_PANEL ]; then cp -a firmware/final-overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/; fi
          for s in v0.4.8.py v0.4.9.py v0.4.10.py v0.4.11.py v0.5.0.py v0.5.0_ota_sync.py v0.5.1.py v0.5.2.py v0.5.3.py v0.5.4.py v0.5.5.py v0.5.6.py v0.5.7.py v0.5.8.py v0.5.9.py v0.5.10.py v0.5.11.py v0.5.12.py v0.5.13.py; do python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL; done
          python3 firmware/scripts/v0.6.0_runner.py firmware/source/work/MIRA_PANEL
          for s in v0.6.1.py v0.6.2.py v0.6.3.py v0.6.4.py v0.6.5.py v0.6.6.py v0.6.7.py v0.6.8.py v0.6.9.py v0.6.10.py v0.6.11.py v0.6.12.py v0.6.13.py v0.6.14.py v0.6.15.py v0.6.16.py v0.6.17.py v0.6.17_fontfix.py; do python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL; done
      - name: Dump layout code
        shell: bash
        run: |
          set -euo pipefail
          UI=firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          H=firmware/source/work/MIRA_PANEL/MiraPanelUI.h
          S=firmware/source/work/MIRA_PANEL/SPIFFS_Process.h
          SRV=firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          echo '===== PAGE INIT + MAKECARD ====='
          sed -n '400,610p' "$UI"
          echo '===== BUILD + REGISTER ====='
          sed -n '600,755p' "$UI"
          echo '===== HEADER PRIVATE ====='
          sed -n '45,190p' "$H"
          echo '===== SPIFFS LVGL ====='
          grep -n -A90 -B30 'AddListLVGL' "$S" || true
          echo '===== SERVER GETLVGL/SAVELIST ====='
          grep -n -A70 -B30 'getlvgl' "$SRV" || true
          grep -n -A70 -B20 'savelistlvgl' "$SRV" || true
