name: EXP Mira 0.7.37 FULL UI - IDF 5.5.6 + LVGL 9.6 Waveshare 7 STD
on:
  workflow_dispatch:
  pull_request:
    branches: [firmware-beta]
    paths:
      - '.github/workflows/build-mira-idf-waveshare.yml'
      - 'firmware/experiments/esp-idf/mira-idf/**'
  push:
    branches: [experiment/mira-idf-full-ui-7]
    paths:
      - '.github/workflows/build-mira-idf-waveshare.yml'
      - 'firmware/experiments/esp-idf/mira-idf/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mira port
        uses: actions/checkout@v4
      - name: Checkout pinned LVGL v9.6.0
        uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: v9.6.0
          path: firmware/experiments/esp-idf/mira-idf/components/lvgl
          submodules: false
      - name: Verify Mira beta HTTP compatibility and validated 7-inch hardware profile
        shell: bash
        run: |
          set -euo pipefail
          ROOT=firmware/experiments/esp-idf/mira-idf
          grep -Fq '#define LVGL_VERSION_MAJOR 9' "$ROOT/components/lvgl/include/lvgl/lv_version.h"
          grep -Fq 'mira_full_ui_create' "$ROOT/main/app_main.c"
          grep -Fq '/spiffs/miralvgl.json' "$ROOT/main/mira_full.c"
          grep -Fq 'format_if_mount_failed=false' "$ROOT/main/mira_full.c"
          grep -Fq 'mira_jeedom_register_http(httpd);' "$ROOT/main/mira_recovery.c"
          grep -Fq 'ESP_ERROR_CHECK(mira_recovery_init())' "$ROOT/main/app_main.c"
          grep -Fq '0x610000, 0x9E0000' "$ROOT/partitions.csv"
          grep -Fq '0x310000, 0x300000' "$ROOT/partitions.csv"
          grep -Fq 'conf.max_uri_handlers = 40;' "$ROOT/main/mira_recovery.c"
          # Never flash a 4.3C RGB/EXIO binary on a Waveshare 7-inch STD.
          grep -Fq '#define LCD_PCLK_HZ (13 * 1000 * 1000)' "$ROOT/main/mira_display.c"
          grep -Fq 'ext_cfg.device_address = 0x38;' "$ROOT/main/mira_display.c"
          grep -Fq 'ioexp_write(ioexp_mode, 0x01)' "$ROOT/main/mira_display.c"
          grep -Fq 'CH422G' "$ROOT/main/mira_display.c"
          grep -Fq '7-inch validated 13MHz CH422G + GT911' "$ROOT/main/app_main.c"
          grep -Fq 'mira_jeedom_action_init' "$ROOT/main/app_main.c"
          grep -Fq 'mira_full_ui_create' "$ROOT/main/app_main.c"
          ! grep -Fq 'esp_vfs_spiffs_format' "$ROOT/main/mira_full.c"
      - name: Native ESP-IDF 5.5.6 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          path: firmware/experiments/esp-idf/mira-idf
          command: idf.py build
      - name: Pack factory USB at 0x0 and OTA application separately
        shell: bash
        run: |
          set -euo pipefail
          ROOT=firmware/experiments/esp-idf/mira-idf/build
          mkdir -p mira_idf_release
          cp "$ROOT/mira_idf_scroll.bin" mira_idf_release/Mira_LVGL96_7_STD_UI_OTA.bin
          export ROOT
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['ROOT'])
          parts=[(0,p/'bootloader/bootloader.bin'),(0x8000,p/'partition_table/partition-table.bin'),(0x10000,p/'mira_idf_scroll.bin')]
          out=bytearray()
          for off,path in parts:
              data=path.read_bytes()
              assert len(data)>0
              limit=0x8000 if off==0 else 0x10000 if off==0x8000 else 0x310000
              assert off+len(data)<=limit
              if len(out)<off:out.extend(b'\xff'*(off-len(out)))
              out.extend(data)
          Path('mira_idf_release/Mira_LVGL96_7_STD_UI_FACTORY_USB_0x0.bin').write_bytes(out)
          print('Factory bytes',len(out))
          PY
          test $(stat -c '%s' mira_idf_release/Mira_LVGL96_7_STD_UI_OTA.bin) -lt 3145728
      - name: Upload build (hardware validation still required)
        uses: actions/upload-artifact@v4
        with:
          name: MIRA_0_7_37_UI_LVGL96_7_STD_FACTORY_OTA
          path: mira_idf_release/
          retention-days: 14
          if-no-files-found: error
