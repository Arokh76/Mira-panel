name: Inspect Mira Panel UI 0.6.6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ui-066.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf firmware/source/work
          mkdir -p firmware/source/work
          unzip -q firmware/source/Mira_Panel_Source_V0.4.3.zip -d firmware/source/work
          cp -a firmware/overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          for p in current.patch ota-safety.patch v0.4.5.patch v0.4.6.patch v0.4.7.patch; do
            if [ -s "firmware/patches/$p" ]; then
              (cd firmware/source/work/MIRA_PANEL && patch --batch --forward -p0 < "../../../patches/$p")
            fi
          done
          if [ -d firmware/final-overrides/MIRA_PANEL ]; then
            cp -a firmware/final-overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          fi
          for s in v0.4.8.py v0.4.9.py v0.4.10.py v0.4.11.py v0.5.0.py v0.5.0_ota_sync.py v0.5.1.py v0.5.2.py v0.5.3.py v0.5.4.py v0.5.5.py v0.5.6.py v0.5.7.py v0.5.8.py v0.5.9.py v0.5.10.py v0.5.11.py v0.5.12.py v0.5.13.py; do
            python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL
          done
          python3 firmware/scripts/v0.6.0_runner.py firmware/source/work/MIRA_PANEL
          for s in v0.6.1.py v0.6.2.py v0.6.3.py v0.6.4.py v0.6.5.py; do
            python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL
          done

      - name: Inspect theme and widget styling
        shell: bash
        run: |
          set -euo pipefail
          UI=firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          HDR=firmware/source/work/MIRA_PANEL/MiraPanelUI.h
          echo '===== VERSION ====='
          grep -n '0.6.5' firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino || true
          echo '===== THEME FUNCTIONS ====='
          grep -nE 'colorBg\(|colorPanel\(|colorAccent\(|colorNav\(|styleMainCard\(|applyTheme\(' "$UI" || true
          echo '===== NAV ====='
          grep -nE 'buildNav|_navButtons|_nav =|NAV_' "$UI" | head -80 || true
          echo '===== WIDGET FACTORY ====='
          grep -nE 'lv_btn_create|lv_switch_create|lv_slider_create|lv_colorwheel_create|lv_arc_create|W_BUTTON|W_TOGGLE|W_RANGE|W_ROUNDRANGE' "$UI" | head -180 || true
          echo '===== COLORS + STYLE BLOCK 1 ====='
          L=$(grep -n 'lv_color_t MiraPanelUI::colorBg' "$UI" | head -1 | cut -d: -f1); sed -n "$((L)), $((L+110))p" "$UI"
          echo '===== NAV BLOCK ====='
          L=$(grep -n '_nav = lv_obj_create' "$UI" | head -1 | cut -d: -f1); sed -n "$((L-20)), $((L+150))p" "$UI"
          echo '===== BUTTON BLOCK ====='
          L=$(grep -n 'b.control = lv_btn_create' "$UI" | head -1 | cut -d: -f1); sed -n "$((L-30)), $((L+180))p" "$UI"
          echo '===== APPLY THEME ====='
          L=$(grep -n 'void MiraPanelUI::applyTheme' "$UI" | head -1 | cut -d: -f1); sed -n "$((L)), $((L+180))p" "$UI"
          echo '===== HEADER THEME MEMBERS ====='
          grep -nE 'ThemeMode|colorAccent|styleMainCard|_theme' "$HDR" || true
