name: EXP Full Mira 0.7.37 native LVGL9.6 4.3C
on:
  workflow_dispatch:
  push:
    branches: [experiment/mira-0737-full-lvgl96-43c]
    paths:
      - '.github/workflows/build-mira-0737-native-lvgl96.yml'
      - 'firmware/source/consolidated/MIRA_PANEL/**'
permissions:
  contents: read
jobs:
  compile-original-mira:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - name: Arduino ESP32 3.3.11 and original Mira dependencies
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli lib update-index
          arduino-cli core install esp32:esp32@3.3.11
          echo '--- ESP32-S3 PSRAM cache settings (bounce-mode compatibility) ---'
          find "$HOME/.arduino15/packages/esp32" -type f -name sdkconfig.h -path '*/esp32s3/*' \\( -exec grep -H -E 'CONFIG_ESP32S3_DATA_CACHE_LINE_(32B|64B)|CONFIG_ESP32S3_DATA_CACHE_LINE_SIZE|CONFIG_SPIRAM_XIP_FROM_PSRAM|CONFIG_LCD_RGB_RESTART_IN_VSYNC' {} \\; \\) || true
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "JPEGDEC@1.8.2"
          arduino-cli lib install "AsyncHTTPRequest_Generic@1.13.0"
          arduino-cli lib install --git-url https://github.com/ESP32Async/AsyncTCP.git
      - name: Install official pinned LVGL 9.6.0 as Arduino library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Arduino/libraries"
          git clone -q --branch v9.6.0 --depth 1 https://github.com/lvgl/lvgl.git "$HOME/Arduino/libraries/lvgl"
          test -f "$HOME/Arduino/libraries/lvgl/library.properties"
          cp "$HOME/Arduino/libraries/lvgl/lv_conf_template.h" "$HOME/Arduino/libraries/lv_conf.h"
          sed -i 's/^#if 0 \/\* Set this to "1" to enable content \*\//#if 1 \/\* Mira 0.7.37 LVGL9 port \*\//' "$HOME/Arduino/libraries/lv_conf.h"
          # Avoid a 256KB static SRAM pool starving Wi-Fi/MQTT; let ESP-IDF's
          # PSRAM-aware heap manage original Mira's LVGL objects.
          sed -i 's/^#define LV_USE_STDLIB_MALLOC LV_STDLIB_BUILTIN/#define LV_USE_STDLIB_MALLOC LV_STDLIB_CLIB/' "$HOME/Arduino/libraries/lv_conf.h"
          for size in 12 16 20 28 40 48; do
            sed -i -E "s/^(#define LV_FONT_MONTSERRAT_${size}) 0$/\1 1/" "$HOME/Arduino/libraries/lv_conf.h"
          done
          grep -Fq '#define LV_FONT_MONTSERRAT_40 1' "$HOME/Arduino/libraries/lv_conf.h"
      - name: Compile ORIGINAL MiraPanelUI / MiraPanelServer / MiraMqtt with native 4.3C
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-native
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,UploadMode=default,UploadSpeed=921600,LoopCore=1,EventsCore=1' \
            --build-property 'compiler.c.extra_flags=-DMIRA_TARGET_WAVESHARE_43C=1 -DMIRA_LVGL9_NATIVE=1 -O2' \
            --build-property 'compiler.cpp.extra_flags=-DMIRA_TARGET_WAVESHARE_43C=1 -DMIRA_LVGL9_NATIVE=1 -O2' \
            --output-dir build-native \
            firmware/source/consolidated/MIRA_PANEL 2>&1 | tee /tmp/build-native.log
          test -s build-native/MIRA_PANEL.ino.bin
      - name: Decode 2026-11-01 exact boot panic and retain full ELF
        shell: bash
        run: |
          set -euo pipefail
          test -s build-native/MIRA_PANEL.ino.elf
          mkdir -p debug
          cp build-native/MIRA_PANEL.ino.elf debug/Mira_0737_LVGL96_43C.elf
          find build-native -maxdepth 1 -name '*.map' -exec cp {} debug/ \; || true
          ADDR2LINE="$(find "$HOME/.arduino15/packages/esp32/tools" -name 'xtensa-esp32s3-elf-addr2line' -type f | head -1)"
          test -x "$ADDR2LINE"
          echo '--- Exact PC and call stack from hardware boot log ---'
          "$ADDR2LINE" -a -p -f -C -i -e debug/Mira_0737_LVGL96_43C.elf \
            0x4205a162 0x4205a15f 0x42052252 0x42063711 0x42050f29 0x4205170d \
            0x420638a9 0x4205f71e 0x4204f857 0x4204f89c 0x4204f90f \
            0x42050e8f 0x4207a4da 0x4214bc32 0x420480d4 0x420481de \
            0x4204d91f 0x4204d517 0x4204d9ca 0x4204dbda 0x4204dce9 \
            0x4204dd91 0x4204e501 0x420700f2 0x4203c367 0x42002f89 \
            0x4209aaf6 0x4037f2e5 | tee debug/panic_decoded.txt
      - name: Preserve native firmware ELF and decoded crash (developer diagnostics only)
        uses: actions/upload-artifact@v4
        with:
          name: Mira_0737_LVGL96_43C_SYMBOLS_AND_PANIC
          path: debug/
          if-no-files-found: error
          retention-days: 3
      - name: Package ONLY on fully compiled original Mira
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp build-native/MIRA_PANEL.ino.bin release/Mira_0737_NATIVE_LVGL96_43C_OTA.bin
          sha256sum release/*.bin > release/SHA256.txt
          echo 'Experimental FULL original Mira 0.7.37 LVGL9.6; validate on board. OTA only.' > release/README.txt
      - name: Build real USB recovery factory image at flash offset 0x0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib
          base=Path('build-native')
          files=list(base.iterdir())
          print('Arduino build output:', [p.name for p in files if p.is_file()])
          def find_one(suffix):
              matches=[x for x in files if x.is_file() and x.name.endswith(suffix)]
              if len(matches)!=1:
                  raise SystemExit(f'Expected one {suffix}; got: {[str(x) for x in matches]}')
              return matches[0].read_bytes()
          boot=find_one('.bootloader.bin')
          part=find_one('.partitions.bin')
          app=find_one('.ino.bin')
          assert boot[0]==0xE9 and app[0]==0xE9, 'invalid Espressif image magic'
          assert part[0:2]==bytes([0xAA,0x50]), 'invalid partition image'
          partitions={}
          for off in range(0,len(part),32):
              if part[off:off+2]!=bytes([0xAA,0x50]):break
              magic,ptype,subtype,address,length,name,flags=struct.unpack_from('<HBBII16sI',part,off)
              name=name.split(b'\x00',1)[0].decode()
              partitions[name]=(ptype,subtype,address,length)
          print('Embedded partition table:',partitions)
          # Fail rather than publishing a USB image that would invalidate
          # Mira's existing original OTA and SPIFFS layout.
          assert partitions.get('app0',(0,0,0,0))[2:]==(0x10000,0x300000)
          assert partitions.get('app1',(0,0,0,0))[2:]==(0x310000,0x300000)
          assert partitions.get('spiffs',(0,0,0,0))[2:]==(0x610000,0x9E0000)
          assert len(boot)<=0x8000 and len(part)<=0x1000
          assert len(app)<=0x300000
          image=bytearray(b'\xff'*(0x10000+len(app)))
          image[0:len(boot)]=boot
          image[0x8000:0x8000+len(part)]=part
          image[0x10000:0x10000+len(app)]=app
          factory=Path('release/Mira_0737_LVGL96_BETA2_USB_RECOVERY_0x0.bin')
          factory.write_bytes(image)
          # Individual flashing of three segments preserves NVS 0x9000-0xDFFF.
          (Path('release/Mira_0737_LVGL96_BETA2_BOOTLOADER_0x0.bin')).write_bytes(boot)
          (Path('release/Mira_0737_LVGL96_BETA2_PARTITIONS_0x8000.bin')).write_bytes(part)
          assert factory.read_bytes()[0x10000:]==app
          print('Factory USB:',len(image),'bytes; app:',len(app),'bytes')
          print('factory SHA256:',hashlib.sha256(image).hexdigest())
          print('SHA256 boot/part/app:',*[hashlib.sha256(x).hexdigest() for x in (boot,part,app)])
          PY
          sha256sum release/*.bin > release/SHA256.txt
          cat > release/README_USB_RECOVERY.txt <<'TXT'
          MIRA 0.7.37 FULL - LVGL 9.6 BETA 2 - FIX LOADPROHIBITED FRENCH FONT
          Recovery USB image (single file):
            Mira_0737_LVGL96_BETA2_USB_RECOVERY_0x0.bin => flash at address 0x0
          WARNING: single factory 0x0 rewrites blank NVS space (Wi-Fi preferences),
          but DOES NOT touch SPIFFS at 0x610000; configuration files persist.
          If using esptool manually, prefer three segments to preserve NVS:
            0x0 bootloader, 0x8000 partitions, 0x10000 OTA/application.
          Do not erase the whole chip. Never flash OTA .bin at 0x0.
          Boot crash fixed by decoding original A4 French glyph bitmaps to
          LVGL 9.6's expected lv_draw_buf_t A8 buffer.
          This is an untested hardware beta, compilation validated in CI.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: MIRA_0737_FULL_LVGL96_BETA2_USB_RECOVERY
          path: release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: MIRA_0737_FULL_ORIGINAL_LVGL96_4_3C_TEST
          path: release/
          if-no-files-found: error
          retention-days: 14
