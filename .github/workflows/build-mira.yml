name: Build Mira Panel 0.7.12 - WT32 SC01 Plus et Waveshare 4.3C

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mira.yml'
      - 'firmware/scripts/v0.6.25.py'
      - 'firmware/scripts/v0.6.26.py'
      - 'firmware/scripts/**'
      - 'firmware/source/**'
      - 'firmware/patches/**'
      - 'firmware/overrides/**'
      - 'firmware/final-overrides/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test release manifest generation
        run: python3 -m unittest discover -s tests -p 'test_publish_multi.py' -v

      - name: Checkout official Waveshare sources
        uses: actions/checkout@v4
        with:
          repository: waveshareteam/ESP32-S3-Touch-LCD-4.3C
          ref: 44e412f08c1e68c0da826bc5f51436f156a02eea
          path: waveshare-official

      - name: Use committed consolidated 0.7.12 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s firmware/source/consolidated/MIRA_PANEL/MIRA_PANEL.ino
          test -s firmware/source/consolidated/MIRA_PANEL/mira_home_montserrat_96.cpp
          test -s firmware/source/consolidated/MIRA_PANEL/mira_sleep_montserrat_120.cpp
          rm -rf firmware/source/work
          mkdir -p firmware/source/work/MIRA_PANEL
          cp -a firmware/source/consolidated/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          grep -q '"0.7.12"' firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
          # Both HOME clocks white; Waveshare uses the identical width/center
          # as its date. The WT32 Montserrat40 & both sleep clocks are intact.
          grep -Fq 'lv_obj_set_style_text_color(_dateTimeLabel, lv_color_white(), 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_width(_dateTimeLabel, 370);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_align(_dateTimeLabel, LV_TEXT_ALIGN_CENTER, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_color(b.valueLabel, lv_color_white(), 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp

          # Home clock must use native Montserrat on BOTH profiles. The
          # Waveshare seven-segment experiment is removed, sleep unchanged.
          grep -Fq 'lv_obj_set_style_text_font(_dateTimeLabel, &mira_home_montserrat_96, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_font(_dateTimeLabel, &lv_font_montserrat_40, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_font(_sleepClock, &mira_sleep_montserrat_120, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          ! grep -q '_clockSegments' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp

          # Center the complete pictogram/value/unit group, including updates.
          grep -Fq 'const lv_coord_t innerW = lv_obj_get_content_width(card)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'const lv_coord_t startX = margin + (innerW - 2 * margin - groupW) / 2;' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_pos(icon, startX, iconY);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_pos(label, startX + iconW + gap,' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_align(label, LV_ALIGN_TOP_LEFT);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp

          # LVGL set_pos keeps an object's old alignment. Explicitly reset
          # Info value labels to top-left to avoid placeholders leaking upward.
          grep -Fq 'lv_obj_set_align(b.valueLabel, LV_ALIGN_TOP_LEFT)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_get_y_aligned(icon)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_pos(label, startX + iconW + gap,' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_get_style_text_letter_space(label, LV_PART_MAIN)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp

          # Regression: value labels cannot spill beyond their parent tile.
          grep -Fq 'const lv_coord_t valueW = w - valueX - pad - 4' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_txt_get_width(' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'miraFitInfoValue(b.valueLabel, b.infoIconRoot);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'if (b.infoIconRoot) miraFitInfoValue(b.valueLabel, b.infoIconRoot);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_font(_sleepClock, &mira_sleep_montserrat_120, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          ! grep -q '_sleepClockCanvas' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'b.labelMode = widgetLabelMode;' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'if (b.type == W_INFO) decorateInfo(idx);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lvgl_array["labelMode"] = LVGL_LabelMode;' firmware/source/work/MIRA_PANEL/SPIFFS_Process.h
          grep -Fq 'lv_obj_set_style_text_font(_sleepClock, &lv_font_montserrat_48, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'MIRA_DISPLAY_WIDTH >= 800 && b.layout != "free"' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'miraMarkInfoArrival' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          # Protect original WT32 typography: 40px Montserrat clock and
          # 14px French date remain in the shared rendering path.
          grep -Fq 'lv_obj_set_style_text_font(b.valueLabel, &lv_font_montserrat_40, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_font(_dateSubLabel, &mira_font_fr_14, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'if (MIRA_DISPLAY_WIDTH >= 800 && b.layout != "free")' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          # Existing WT32 settings width remains exactly 304px.
          grep -Fq 'MIRA_DISPLAY_WIDTH >= 800 ? 640 : 304' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          # Regression guard: settings rows cannot exceed their settings card.
          grep -Fq 'MIRA_DISPLAY_WIDTH >= 800 ? 640 : 304' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'MIRA_DISPLAY_WIDTH >= 800 ? lv_pct(100) : 284' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'MIRA_DISPLAY_WIDTH >= 800 ? 600 : 280' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'MIRA_CARD_TILE = MIRA_DISPLAY_WIDTH >= 800 ? 192 : 149' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'MIRA_CARD_AUTO = MIRA_DISPLAY_WIDTH >= 800 ? 390 : 304' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'MIRA_DISPLAY_WIDTH <= 320' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q '#define LV_COLOR_16_SWAP 0' firmware/source/work/MIRA_PANEL/lv_conf.h
          test -f firmware/source/work/MIRA_PANEL/MiraPartitionsWaveshare16MB.csv

      - name: Verify bundled Montserrat home and sleep font sources
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'mira_home_montserrat_96' firmware/source/work/MIRA_PANEL/mira_home_montserrat_96.cpp
          grep -Fq 'mira_sleep_montserrat_120' firmware/source/work/MIRA_PANEL/mira_sleep_montserrat_120.cpp

      - name: Setup Arduino CLI 1.5.1
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Configure Arduino
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@8.3.11"
          arduino-cli lib install "LovyanGFX@1.1.9"
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "AsyncHTTPRequest_Generic@1.13.0"

      - name: Build WT32-SC01 Plus 0.7.12 firmware
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "AsyncTCP@1.1.4"
          CW="$HOME/Arduino/libraries/lvgl/src/extra/widgets/colorwheel/lv_colorwheel.c"
          sed -i 's/line_dsc.width += 2;/line_dsc.width += 4;/' "$CW"
          cp firmware/source/work/MIRA_PANEL/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"
          rm -f firmware/source/work/MIRA_PANEL/partitions.csv
          rm -rf build-wt32 && mkdir build-wt32
          arduino-cli compile             --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled,UploadMode=default,USBMode=hwcdc"             --output-dir build-wt32             firmware/source/work/MIRA_PANEL
          test -s build-wt32/MIRA_PANEL.ino.bin
          strings build-wt32/MIRA_PANEL.ino.bin | grep -Fxq '0.7.12'
          strings build-wt32/MIRA_PANEL.ino.bin | grep -Fq 'WT32-SC01 Plus'

      - name: Package WT32-SC01 Plus 0.7.12 OTA preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-wt32
          cp build-wt32/MIRA_PANEL.ino.bin package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.12.bin
          # WT32 USB factory image uses the existing 8 MB partition table.
          test -s build-wt32/MIRA_PANEL.ino.bootloader.bin
          test -s build-wt32/MIRA_PANEL.ino.partitions.bin
          BOOTAPP="$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin -type f | head -n1)"
          test -s "$BOOTAPP"
          python3 -m pip install --quiet esptool
          python3 -m esptool --chip esp32s3 merge-bin \
            -o package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.12_FACTORY.bin \
            --flash-mode dio --flash-freq 80m --flash-size 8MB \
            0x0000 build-wt32/MIRA_PANEL.ino.bootloader.bin \
            0x8000 build-wt32/MIRA_PANEL.ino.partitions.bin \
            0xE000 "$BOOTAPP" \
            0x10000 package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.12.bin
          test -s package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.12_FACTORY.bin
          cat > package-wt32/README.txt <<'EOF'
          Mira Panel 0.7.12 - WT32-SC01 Plus ESP32-S3 / 8 MB FLASH
          OTA application firmware: Mira_Panel_WT32_SC01_Plus_0.7.12.bin
          Compiled using Arduino-ESP32 2.0.17, LVGL 8.3.11.
          WARNING: WT32-specific firmware. Never flash to Waveshare 4.3C.
          This is a preview for hardware testing, not a stable release.
          USB factory firmware: Mira_Panel_WT32_SC01_Plus_0.7.12_FACTORY.bin
          EOF
          test -s package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.12.bin
          strings package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.12.bin | grep -Fxq '0.7.12'
          sha256sum package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.12.bin

      - name: Upload WT32-SC01 Plus preview
        uses: actions/upload-artifact@v4
        with:
          name: Mira_Panel_WT32_SC01_Plus_0.7.12_preview
          path: package-wt32/
          if-no-files-found: error
          retention-days: 14

      - name: Switch to ESP32 core 3.3.11 and Waveshare LVGL 8.4
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core uninstall esp32:esp32
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib uninstall AsyncTCP || true
          rm -rf "$HOME/Arduino/libraries/AsyncTCP" "$HOME/Arduino/libraries/Async_TCP"
          arduino-cli lib install --git-url https://github.com/ESP32Async/AsyncTCP.git

          # The WT32 build above intentionally uses LVGL 8.3.11.
          # Remove it before the Waveshare build so Arduino cannot select it.
          arduino-cli lib uninstall lvgl || true
          rm -rf "$HOME/Arduino/libraries/lvgl"

          # Use Waveshare's bundled LVGL 8.4 AND its own lv_conf.h.
          # Only enable the extra fonts Mira actually references and enlarge
          # LVGL's object heap. Display/tick/color settings remain Waveshare's.
          WS_CONF="waveshare-official/examples/arduino/libraries/lv_conf.h"
          grep -q 'Configuration file for v8.4.0' "$WS_CONF"
          grep -q '#define LVGL_VERSION_MINOR 4' waveshare-official/examples/arduino/libraries/lvgl/lvgl.h
          sed -i 's/#define LV_MEM_SIZE (48U \* 1024U)/#define LV_MEM_SIZE (96U * 1024U)/' "$WS_CONF"
          # LVGL 8.4 snapshot module: external PSRAM buffers, no dynamic
          # allocations from LVGL's 96 KB object heap.
          grep -Fq '#define LV_USE_SNAPSHOT 0' "$WS_CONF"
          sed -i 's/#define LV_USE_SNAPSHOT 0/#define LV_USE_SNAPSHOT 1/' "$WS_CONF"
          grep -Fq '#define LV_USE_SNAPSHOT 1' "$WS_CONF"
          sed -i 's/#define LV_FONT_MONTSERRAT_20 0/#define LV_FONT_MONTSERRAT_20 1/' "$WS_CONF"
          sed -i 's/#define LV_FONT_MONTSERRAT_28 0/#define LV_FONT_MONTSERRAT_28 1/' "$WS_CONF"
          sed -i 's/#define LV_FONT_MONTSERRAT_40 0/#define LV_FONT_MONTSERRAT_40 1/' "$WS_CONF"
          sed -i 's/#define LV_FONT_MONTSERRAT_48 0/#define LV_FONT_MONTSERRAT_48 1/' "$WS_CONF"
          grep -q '#define LV_COLOR_16_SWAP 0' "$WS_CONF"
          grep -q '#define LV_TICK_CUSTOM 0' "$WS_CONF"

          # Copy the exact, already-proven 12_lvgl_transplant hardware/LVGL port.
          rm -rf firmware/source/work/MIRA_PANEL/src/WaveshareOfficial
          mkdir -p firmware/source/work/MIRA_PANEL/src/WaveshareOfficial
          cp -a waveshare-official/examples/arduino/12_lvgl_transplant/src/. \
            firmware/source/work/MIRA_PANEL/src/WaveshareOfficial/
          test -f firmware/source/work/MIRA_PANEL/src/WaveshareOfficial/lvgl_port/lvgl_port.cpp
          test -f firmware/source/work/MIRA_PANEL/src/WaveshareOfficial/rgb_lcd_port/rgb_lcd_port.cpp

          # 0.7.12 performance experiment, Waveshare ONLY:
          # revert to the port's recommended double-buffer + direct-mode
          # and refresh dirty areas instead of the complete 800x480 screen.
          # Keep the 0.7.4 triple-buffer build for hardware A/B and rollback.
          WS_PORT_H="firmware/source/work/MIRA_PANEL/src/WaveshareOfficial/lvgl_port/lvgl_port.h"
          WS_RGB_H="firmware/source/work/MIRA_PANEL/src/WaveshareOfficial/rgb_lcd_port/rgb_lcd_port.h"
          grep -Fq '#define LVGL_PORT_AVOID_TEAR_MODE       (3)' "$WS_PORT_H"
          grep -Fq '#define EXAMPLE_LCD_RGB_BUFFER_NUMS     (2)' "$WS_RGB_H"
          echo '[MIRA][WAVESHARE] Mode 3 direct, 2 FB: partial LVGL redraws'

          # Keep the 0.6.38 proven adjustment: change ONLY RGB PCLK
          # from the official 16 MHz to 12 MHz; do not change validated
          # VSYNC, LVGL, PSRAM, bounce-buffer or backlight configurations.
          grep -Fq '#define EXAMPLE_LCD_PIXEL_CLOCK_HZ      (16 * 1000 * 1000)' "$WS_RGB_H"
          python3 -c "from pathlib import Path; p=Path('firmware/source/work/MIRA_PANEL/src/WaveshareOfficial/rgb_lcd_port/rgb_lcd_port.h'); s=p.read_text(); old='(16 * 1000 * 1000)'; assert s.count(old) == 1, 'expected one 16 MHz LCD clock macro'; p.write_text(s.replace(old, '(12 * 1000 * 1000)', 1))"
          grep -Fq '#define EXAMPLE_LCD_PIXEL_CLOCK_HZ      (12 * 1000 * 1000)' "$WS_RGB_H"
          echo '[MIRA][WAVESHARE] RGB: proven pixel clock = 12 MHz'

          # Critical: a sketch-local lv_conf.h has priority over the library's
          # sibling lv_conf.h. Remove Mira's WT32 config for this build, otherwise
          # the "official LVGL 8.4" silently runs with Mira's old LVGL config.
          rm -f firmware/source/work/MIRA_PANEL/lv_conf.h
          test ! -f firmware/source/work/MIRA_PANEL/lv_conf.h

      # Compare optimized software rasterization only, no display/VSYNC changes.
      # -O2 is appended to core defaults (-Os) for C LVGL and C++ UI code.
      - name: Build Waveshare 4.3C with Mira SPIFFS map
        shell: bash
        run: |
          set -euo pipefail
          cp firmware/source/work/MIRA_PANEL/MiraPartitionsWaveshare16MB.csv firmware/source/work/MIRA_PANEL/partitions.csv
          rm -rf build-waveshare package-waveshare
          mkdir -p build-waveshare package-waveshare
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,UploadMode=default,UploadSpeed=921600,LoopCore=1,EventsCore=1" \
            --libraries waveshare-official/examples/arduino/libraries \
            --build-property "compiler.c.extra_flags=-O2" \
            --build-property "compiler.cpp.extra_flags=-DMIRA_TARGET_WAVESHARE_43C=1 -O2" \
            --output-dir build-waveshare \
            firmware/source/work/MIRA_PANEL
          test -s build-waveshare/MIRA_PANEL.ino.bin
          strings build-waveshare/MIRA_PANEL.ino.bin | grep -Fxq '0.7.12'
          strings build-waveshare/MIRA_PANEL.ino.bin | grep -Fq 'Waveshare ESP32-S3 Touch LCD 4.3C'
          strings build-waveshare/MIRA_PANEL.ino.bin | grep -Fq '[MIRA][WAVESHARE] Port LVGL Waveshare officiel actif'
          PARTTOOL="$(find "$HOME/.arduino15/packages/esp32" -name gen_esp32part.py -type f | head -n1)"
          test -n "$PARTTOOL"
          python3 "$PARTTOOL" build-waveshare/MIRA_PANEL.ino.partitions.bin > /tmp/partitions-decoded.csv
          cat /tmp/partitions-decoded.csv
          grep -q 'spiffs' /tmp/partitions-decoded.csv
          ! grep -q 'ffat' /tmp/partitions-decoded.csv

          cp build-waveshare/MIRA_PANEL.ino.bin package-waveshare/Mira_Panel_Waveshare_4.3C_0.7.12.bin
          cp build-waveshare/MIRA_PANEL.ino.bootloader.bin package-waveshare/bootloader.bin
          cp build-waveshare/MIRA_PANEL.ino.partitions.bin package-waveshare/partitions.bin
          BOOTAPP="$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin -type f | head -n1)"
          cp "$BOOTAPP" package-waveshare/boot_app0.bin
          cat > package-waveshare/flash_args.txt <<'EOF'
          ESP32-S3 / 16 MB / Mira SPIFFS:
          0x0000  bootloader.bin
          0x8000  partitions.bin
          0xE000  boot_app0.bin
          0x10000 Mira_Panel_Waveshare_4.3C_0.7.12.bin
          EOF

          MERGED="$(find build-waveshare -maxdepth 1 -name '*merged.bin' -type f | head -n1 || true)"
          if [ -n "$MERGED" ]; then
            cp "$MERGED" package-waveshare/Mira_Panel_Waveshare_4.3C_0.7.12_FACTORY.bin
          else
            python3 -m pip install --quiet esptool
            python3 -m esptool --chip esp32s3 merge-bin -o package-waveshare/Mira_Panel_Waveshare_4.3C_0.7.12_FACTORY.bin --flash-mode qio --flash-freq 80m --flash-size 16MB 0x0000 package-waveshare/bootloader.bin 0x8000 package-waveshare/partitions.bin 0xE000 package-waveshare/boot_app0.bin 0x10000 package-waveshare/Mira_Panel_Waveshare_4.3C_0.7.12.bin
          fi
          test -s package-waveshare/Mira_Panel_Waveshare_4.3C_0.7.12_FACTORY.bin
          ls -lh package-waveshare/

      - name: Upload Waveshare preview package
        uses: actions/upload-artifact@v4
        with:
          name: Mira_Panel_Waveshare_4.3C_0.7.12_preview
          path: package-waveshare/
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test multi-target publication with the actual compiled binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mira-release-check/inputs/wt32 /tmp/mira-release-check/inputs/waveshare
          cp package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.12*.bin /tmp/mira-release-check/inputs/wt32/
          cp package-waveshare/Mira_Panel_Waveshare_4.3C_0.7.12*.bin /tmp/mira-release-check/inputs/waveshare/
          python3 firmware/scripts/publish_multi.py \
            --inputs /tmp/mira-release-check/inputs \
            --repo /tmp/mira-release-check/output \
            --version 0.7.12
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('/tmp/mira-release-check/output/firmware/targets.json')
          data = json.loads(p.read_text())
          assert data['version'] == '0.7.12'
          assert len(data['targets']) == 2
          legacy = json.loads(Path('/tmp/mira-release-check/output/firmware/version.json').read_text())
          assert legacy['version'] == '0.7.12'
          assert Path('/tmp/mira-release-check/output/firmware/Mira_Panel.bin').is_file()
          assert Path('/tmp/mira-release-check/output/docs/manifest.json').is_file()
          for profile, spec in data['targets'].items():
              assert len(spec['otaSha256']) == 64
              assert len(spec['factorySha256']) == 64
              assert spec['otaBytes'] > 500000
          print('Both real Mira firmware profiles can be published together')
          PY
