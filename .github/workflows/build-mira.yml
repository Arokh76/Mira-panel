name: Build Mira Panel 0.7.44 - WT32 Nextion Arduino

on:
  workflow_dispatch:
  pull_request:
    branches: [main, firmware-beta]
  push:
    branches: [main, firmware-beta]
    paths:
      - '.github/workflows/build-mira.yml'
      - 'firmware/scripts/publish_multi.py'
      - 'firmware/source/**'
      - 'Arduino/**'
      - 'tests/test_publish_multi.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test release manifest generation
        run: python3 -m unittest discover -s tests -p 'test_publish_multi.py' -v

      - name: Use committed consolidated 0.7.44 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s Arduino/MIRA_PANEL/MIRA_PANEL.ino
          test ! -e Arduino/MIRA_PANEL/Waveshare43CDisplay.h
          test -s Arduino/MIRA_PANEL/mira_home_montserrat_96.cpp
          test -s Arduino/MIRA_PANEL/mira_sleep_montserrat_120.cpp
          rm -rf firmware/source/work
          mkdir -p firmware/source/work/MIRA_PANEL
          cp -a Arduino/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/
          grep -q '"0.7.44"' firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
          # RAZ and manual release clear input AND output mappings, never
          # GPIO electrical configuration or unrelated NVS namespaces.
          grep -Fq 'lastReadFailed=false' firmware/source/work/MIRA_PANEL/HTML/HTML_GPIO.h
          grep -Fq 'server.on("/actions/bindings"' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'server.on("/gpio/multi/status"' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          # HTTP queue regression checks: retries must be bounded and only a
          # single head entry can be acknowledged per Jeedom HTTP response.
          grep -Fq 'static constexpr uint8_t QUEUE_CAPACITY = 16;' firmware/source/work/MIRA_PANEL/MiraPanelServer.h
          grep -Fq 'return request.send();' firmware/source/work/MIRA_PANEL/Async_HTTP.h
          grep -Fq 'head.send = submitted;' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'if (miraAsyncHTTPBusy())' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq '++miraQueueDroppedFull;' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'AdvanceQueuedHead();' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'miraSaveActionBindings(' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'RestoreActionBindingsForLvgl();' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'Reponse Jeedom invalide : table precedente conservee' firmware/source/work/MIRA_PANEL/SPIFFS_Process.h
          grep -Fq 'multiDiagnostics(JsonObject out)' firmware/source/work/MIRA_PANEL/MiraWT32Gpio.h
          grep -Fq 'multiPollCalls' firmware/source/work/MIRA_PANEL/MiraWT32Gpio.h
          grep -Fq 'Diagnostic des boutons GPIO (lecture seule)' firmware/source/work/MIRA_PANEL/HTML/HTML_GPIO.h
          grep -Fq 'server.on("/gpio/associations/reset"' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'static bool resetAssociations()' firmware/source/work/MIRA_PANEL/MiraWT32Gpio.h
          grep -Fq 'static bool resetLinks()' firmware/source/work/MIRA_PANEL/MiraWT32Gpio.h
          grep -Fq 'MiraWT32GPIO::resetAssociations()' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'Liberer les associations</button>' firmware/source/work/MIRA_PANEL/HTML/HTML_GPIO.h
          grep -Fq 'id="resetAssociations"' firmware/source/work/MIRA_PANEL/HTML/HTML_GPIO.h
          # Compatibility for earlier WT32 clients using the old scoped route.
          grep -Fq 'static bool multiReset()' firmware/source/work/MIRA_PANEL/MiraWT32Gpio.h
          grep -Fq 'server.on("/gpio/multi/reset", HTTP_POST' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          # Keep the physically validated WT32 beta fixes in the normal build:
          # JSON action values, optional Rose theme and compact Mira boot logo.
          grep -Fq 'miraCompactActionValues()' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'THEME_ROSE = 3' firmware/source/work/MIRA_PANEL/MiraPanelUI.h
          grep -Fq 'MiraBootLogo::image()' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'W = 150' firmware/source/work/MIRA_PANEL/MiraBootLogo.h
          # Regression protection: never publish a build without the
          # clock weather overlay AND passive light state restoration.
          grep -Fq '__mira_weather_temperature' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq '__mira_weather_condition' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'server.on("/sync/toggle"' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'IndexGetPassiveToggleEvent' firmware/source/work/MIRA_PANEL/MiraPanelServer.h
          grep -Fq 'IndexGetPassiveToggleEvent()' firmware/source/work/MIRA_PANEL/MIRA_PANEL.ino
          # RGB #RRGGBB (7 chars) requires 8 bytes, including the null terminator.
          ! grep -Fq 'char CValue[7];' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          ! grep -Fq 'char hexArray[6]' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          # Both HOME clocks white; Waveshare uses the identical width/center
          # as its date. The WT32 Montserrat40 & both sleep clocks are intact.
          grep -Fq 'lv_obj_set_style_text_color(_dateTimeLabel, lv_color_white(), 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_width(_dateTimeLabel, 370);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_align(_dateTimeLabel, LV_TEXT_ALIGN_CENTER, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_color(b.valueLabel, lv_color_white(), 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp

          # Home clock must use native Montserrat on BOTH profiles. The
          # Waveshare seven-segment experiment is removed, sleep unchanged.
          grep -Fq 'lv_obj_set_style_text_font(_dateTimeLabel, &mira_home_montserrat_96, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_font(_dateTimeLabel, &lv_font_montserrat_40, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_font(_sleepClock, &mira_sleep_montserrat_120, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          ! grep -q '_clockSegments' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp

          # Center the complete pictogram/value/unit group, including updates.
          grep -Fq 'const lv_coord_t innerW = lv_obj_get_content_width(card)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'const lv_coord_t startX = margin + (innerW - 2 * margin - groupW) / 2;' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_pos(icon, startX, iconY);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_pos(label, startX + iconW + gap,' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_align(label, LV_ALIGN_TOP_LEFT);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp

          # LVGL set_pos keeps an object's old alignment. Explicitly reset
          # Info value labels to top-left to avoid placeholders leaking upward.
          grep -Fq 'lv_obj_set_align(b.valueLabel, LV_ALIGN_TOP_LEFT)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_get_y_aligned(icon)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_pos(label, startX + iconW + gap,' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_get_style_text_letter_space(label, LV_PART_MAIN)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp

          # Regression: value labels cannot spill beyond their parent tile.
          grep -Fq 'const lv_coord_t valueW = w - valueX - pad - 4' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_txt_get_width(' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'miraFitInfoValue(b.valueLabel, b.infoIconRoot);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'if (b.infoIconRoot) miraFitInfoValue(b.valueLabel, b.infoIconRoot);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_font(_sleepClock, &mira_sleep_montserrat_120, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          ! grep -q '_sleepClockCanvas' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'b.labelMode = widgetLabelMode;' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'if (b.type == W_INFO) decorateInfo(idx);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lvgl_array["labelMode"] = LVGL_LabelMode;' firmware/source/work/MIRA_PANEL/SPIFFS_Process.h
          grep -Fq 'lv_obj_set_style_text_font(_sleepClock, &mira_sleep_montserrat_84, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_color(_sleepClock, lv_color_white(), 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_label_set_text(_sleepDate, fullDate);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'const String temperature = firstSleepTemperature();' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'b.type != W_INFO' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          test -s firmware/source/work/MIRA_PANEL/mira_sleep_montserrat_84.cpp
          grep -Fq 'MIRA_DISPLAY_WIDTH >= 800 && b.layout != "free"' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'miraMarkInfoArrival' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          # Protect original WT32 typography: 40px Montserrat clock and
          # 14px French date remain in the shared rendering path.
          grep -Fq 'lv_obj_set_style_text_font(b.valueLabel, &lv_font_montserrat_40, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_obj_set_style_text_font(_dateSubLabel, &mira_font_fr_14, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'if (MIRA_DISPLAY_WIDTH >= 800 && b.layout != "free")' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          # Existing WT32 settings width remains exactly 304px.
          grep -Fq 'MIRA_DISPLAY_WIDTH >= 800 ? 640 : (MIRA_DISPLAY_WIDTH <= 240 ? 224 : 304)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          # Regression guard: settings rows cannot exceed their settings card.
          grep -Fq 'MIRA_DISPLAY_WIDTH >= 800 ? 640 : (MIRA_DISPLAY_WIDTH <= 240 ? 224 : 304)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'MIRA_DISPLAY_WIDTH >= 800 ? lv_pct(100) : (MIRA_DISPLAY_WIDTH <= 240 ? 204 : 284)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'MIRA_DISPLAY_WIDTH >= 800 ? 600 : (MIRA_DISPLAY_WIDTH <= 240 ? 200 : 280)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'MIRA_CARD_TILE = MIRA_DISPLAY_WIDTH >= 800 ? 192 : (MIRA_DISPLAY_WIDTH <= 240 ? 108 : 149)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'MIRA_CARD_AUTO = MIRA_DISPLAY_WIDTH >= 800 ? 390 : (MIRA_DISPLAY_WIDTH <= 240 ? 224 : 304)' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q 'MIRA_DISPLAY_WIDTH <= 320' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -q '#define LV_COLOR_16_SWAP 0' firmware/source/work/MIRA_PANEL/lv_conf.h
          test -f firmware/source/work/MIRA_PANEL/MiraPartitions16MB.csv

      - name: Verify bundled Montserrat home and sleep font sources
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'mira_home_montserrat_96' firmware/source/work/MIRA_PANEL/mira_home_montserrat_96.cpp
          grep -Fq 'mira_sleep_montserrat_120' firmware/source/work/MIRA_PANEL/mira_sleep_montserrat_120.cpp
          grep -Fq 'mira_sleep_montserrat_84' firmware/source/work/MIRA_PANEL/mira_sleep_montserrat_84.cpp

      - name: Camera RGB565 byte-order preflight
        shell: bash
        run: |
          set -euo pipefail
          # RGB565 camera test: source must explicitly honor LVGL's
          # WT32/Nextion byte swap and Waveshare native pixel format.
          grep -Fq '#if LV_COLOR_16_SWAP' firmware/source/work/MIRA_PANEL/MiraCameraBmp.cpp
          grep -Fq 'jpeg->setPixelType(RGB565_BIG_ENDIAN);' firmware/source/work/MIRA_PANEL/MiraCameraBmp.cpp
          grep -Fq 'jpeg->setPixelType(RGB565_LITTLE_ENDIAN);' firmware/source/work/MIRA_PANEL/MiraCameraBmp.cpp
          grep -Fq 'dest[x] = miraNativeImage565(rgb565);' firmware/source/work/MIRA_PANEL/MiraCameraBmp.cpp
          grep -Fq 'lv_img_set_zoom(_cameraImage, (uint16_t)zoom);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'lv_img_set_angle(_cameraImage, 0);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq '_refreshIntervalMs = 250;' firmware/source/work/MIRA_PANEL/MiraCameraBmp.cpp
          grep -Fq '_refreshIntervalMs = ok ? 250 : 2000;' firmware/source/work/MIRA_PANEL/MiraCameraBmp.cpp
          grep -Fq 'PAGE_COUNT = 6;' firmware/source/work/MIRA_PANEL/MiraPanelUI.h
          grep -Fq 'location == "energie"' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq '"Accueil", "Lumières", "Températures", "Paramètres", "Énergie", "Multimédia"' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'page > 5' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          ! grep -Fq 'Ajoutez des widgets' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'createEnergy(idx);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'createMedia(idx);' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'location == "multimedia"' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq '_visiblePageMask' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'server.on("/navpages", HTTP_POST' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          ! grep -Fq 'i == 4 ? "%" : "W"' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp
          grep -Fq 'pageMask' firmware/source/work/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'onMediaVolume' firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp

      - name: Setup Arduino CLI 1.5.1
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Configure Arduino
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@8.3.11"
          arduino-cli lib install "LovyanGFX@1.1.9"
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "JPEGDEC@1.8.2"
          arduino-cli lib install "AsyncHTTPRequest_Generic@1.13.0"

      - name: Build WT32-SC01 Plus 0.7.44 firmware
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "AsyncTCP@1.1.4"
          CW="$HOME/Arduino/libraries/lvgl/src/extra/widgets/colorwheel/lv_colorwheel.c"
          sed -i 's/line_dsc.width += 2;/line_dsc.width += 4;/' "$CW"
          cp firmware/source/work/MIRA_PANEL/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"
          rm -f firmware/source/work/MIRA_PANEL/partitions.csv
          rm -rf build-wt32 && mkdir build-wt32
          arduino-cli compile             --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled,UploadMode=default,USBMode=hwcdc"             --output-dir build-wt32             firmware/source/work/MIRA_PANEL
          test -s build-wt32/MIRA_PANEL.ino.bin
          strings build-wt32/MIRA_PANEL.ino.bin | grep -Fxq '0.7.44'
          strings build-wt32/MIRA_PANEL.ino.bin | grep -Fq 'WT32-SC01 Plus'

      - name: Package WT32-SC01 Plus 0.7.44 OTA preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-wt32
          cp build-wt32/MIRA_PANEL.ino.bin package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.44.bin
          # WT32 USB factory image uses the existing 8 MB partition table.
          test -s build-wt32/MIRA_PANEL.ino.bootloader.bin
          test -s build-wt32/MIRA_PANEL.ino.partitions.bin
          BOOTAPP="$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin -type f | head -n1)"
          test -s "$BOOTAPP"
          python3 -m pip install --quiet esptool
          python3 -m esptool --chip esp32s3 merge-bin \
            -o package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.44_FACTORY.bin \
            --flash-mode dio --flash-freq 80m --flash-size 8MB \
            0x0000 build-wt32/MIRA_PANEL.ino.bootloader.bin \
            0x8000 build-wt32/MIRA_PANEL.ino.partitions.bin \
            0xE000 "$BOOTAPP" \
            0x10000 package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.44.bin
          test -s package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.44_FACTORY.bin
          cat > package-wt32/README.txt <<'EOF'
          Mira Panel 0.7.44 - WT32-SC01 Plus ESP32-S3 / 8 MB FLASH
          OTA application firmware: Mira_Panel_WT32_SC01_Plus_0.7.44.bin
          Compiled using Arduino-ESP32 2.0.17, LVGL 8.3.11.
          WARNING: WT32-specific firmware. Never flash to Waveshare 4.3C.
          This is a preview for hardware testing, not a stable release.
          USB factory firmware: Mira_Panel_WT32_SC01_Plus_0.7.44_FACTORY.bin
          EOF
          test -s package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.44.bin
          strings package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.44.bin | grep -Fxq '0.7.44'
          sha256sum package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.44.bin

      - name: Upload WT32-SC01 Plus preview
        uses: actions/upload-artifact@v4
        with:
          name: Mira_Panel_WT32_SC01_Plus_0.7.44_preview
          path: package-wt32/
          if-no-files-found: error
          retention-days: 14

      - name: Build Open Nextion Genius 2.8 (experimental hardware, same 0.7.44)
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli lib install "GFX Library for Arduino@1.4.9"
          arduino-cli lib install "Adafruit CST8XX Library"
          arduino-cli lib install "Adafruit PCF8574"
          rm -rf build-nextion-src build-nextion package-nextion
          mkdir -p build-nextion-src/MIRA_PANEL build-nextion package-nextion
          cp -a Arduino/MIRA_PANEL/. build-nextion-src/MIRA_PANEL/
          cp Arduino/MIRA_PANEL/MiraPartitions16MB.csv build-nextion-src/MIRA_PANEL/partitions.csv
          cp build-nextion-src/MIRA_PANEL/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"
          test -s build-nextion-src/MIRA_PANEL/MiraNextion28Display.h
          grep -Fq '"0.7.44"' build-nextion-src/MIRA_PANEL/MIRA_PANEL.ino
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=default,CPUFreq=240,FlashMode=dio,FlashSize=16M,PartitionScheme=default_8MB,PSRAM=opi,UploadMode=default,USBMode=hwcdc" \
            --build-property "compiler.cpp.extra_flags=-DMIRA_TARGET_NEXTION_28=1" \
            --build-property "build.flash_freq=40m" \
            --output-dir build-nextion \
            build-nextion-src/MIRA_PANEL
          test -s build-nextion/MIRA_PANEL.ino.bin
          strings build-nextion/MIRA_PANEL.ino.bin | grep -Fxq '0.7.44'
          strings build-nextion/MIRA_PANEL.ino.bin | grep -Fq 'OPEN-NEXTION-GENIUS-2.8'
          PART_TOOL="$(find "$HOME/.arduino15/packages/esp32" -name gen_esp32part.py -type f | head -n1)"
          python3 "$PART_TOOL" build-nextion/MIRA_PANEL.ino.partitions.bin >/tmp/nextion-parts.csv
          grep -q 'ota_0' /tmp/nextion-parts.csv
          grep -q 'ota_1' /tmp/nextion-parts.csv
          cp build-nextion/MIRA_PANEL.ino.bin package-nextion/Mira_Panel_Nextion_2.8_0.7.44.bin
          BOOTAPP="$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin -type f | head -n1)"
          python3 -m pip install --quiet esptool
          python3 -m esptool --chip esp32s3 merge-bin \
            -o package-nextion/Mira_Panel_Nextion_2.8_0.7.44_FACTORY.bin \
            --flash-mode dio --flash-freq 40m --flash-size 16MB \
            0x0000 build-nextion/MIRA_PANEL.ino.bootloader.bin \
            0x8000 build-nextion/MIRA_PANEL.ino.partitions.bin \
            0xE000 "$BOOTAPP" \
            0x10000 package-nextion/Mira_Panel_Nextion_2.8_0.7.44.bin
          test -s package-nextion/Mira_Panel_Nextion_2.8_0.7.44_FACTORY.bin
          sha256sum package-nextion/*.bin

      - name: Upload Nextion 2.8 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mira_Panel_Nextion_2.8_0.7.44_preview
          path: package-nextion/
          retention-days: 14
          if-no-files-found: error

      - name: Smoke-test both Arduino targets using actual compiled binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mira-release-check/inputs/wt32 /tmp/mira-release-check/inputs/nextion
          cp package-wt32/Mira_Panel_WT32_SC01_Plus_0.7.44*.bin /tmp/mira-release-check/inputs/wt32/
          cp package-nextion/Mira_Panel_Nextion_2.8_0.7.44*.bin /tmp/mira-release-check/inputs/nextion/
          python3 firmware/scripts/publish_multi.py \
            --inputs /tmp/mira-release-check/inputs \
            --repo /tmp/mira-release-check/output \
            --version 0.7.44
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('/tmp/mira-release-check/output/firmware/targets.json')
          data = json.loads(p.read_text())
          assert data['version'] == '0.7.44'
          assert set(data['targets']) == {'wt32-sc01-plus', 'onx2432g028'}
          # The old untyped OTA feed must stay pinned for older Waveshare.
          # The release generator deliberately does not write it.
          assert not Path('/tmp/mira-release-check/output/firmware/version.json').exists()
          assert not Path('/tmp/mira-release-check/output/firmware/Mira_Panel.bin').exists()
          assert Path('/tmp/mira-release-check/output/docs/manifest.json').is_file()
          assert Path('/tmp/mira-release-check/output/docs/manifest-nextion.json').is_file()
          for profile, spec in data['targets'].items():
              assert len(spec['otaSha256']) == 64
              assert len(spec['factorySha256']) == 64
              assert spec['otaBytes'] > 500000
          print('WT32 and Nextion builds ready; ESP-IDF Waveshare separately')
          PY

