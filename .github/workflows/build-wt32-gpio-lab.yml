name: WT32 GPIO local web experimental build
on:
  push:
    branches: [feature/wt32-multiaction-dev5]
    paths:
      - "firmware/source/consolidated/**"
      - ".github/workflows/build-wt32-gpio-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - name: Setup matching Mira 0.7.14 Arduino environment
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli lib update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "lvgl@8.3.11"
          arduino-cli lib install "LovyanGFX@1.1.9"
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "AsyncHTTPRequest_Generic@1.13.0"
          arduino-cli lib install "AsyncTCP@1.1.4"
      - name: Prepare isolated WT32 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-gpio-src/MIRA_PANEL "$HOME/Arduino/libraries"
          cp -a firmware/source/consolidated/MIRA_PANEL/. build-gpio-src/MIRA_PANEL/
          cp build-gpio-src/MIRA_PANEL/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"
          rm -f build-gpio-src/MIRA_PANEL/partitions.csv
          grep -Fq '"0.7.14-wt32-gpio-dev5"' build-gpio-src/MIRA_PANEL/MIRA_PANEL.ino
          grep -Fq 'MiraWT32GPIO::begin();' build-gpio-src/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'Page_GPIO' build-gpio-src/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq '/gpio/config' build-gpio-src/MIRA_PANEL/MiraPanelServer.cpp
          grep -Fq 'GPIO WT32' build-gpio-src/MIRA_PANEL/HTML/HTML_Sys.h
      - name: Compile WT32 local GPIO web firmware
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled,UploadMode=default,USBMode=hwcdc" \
            --output-dir build-gpio-bin build-gpio-src/MIRA_PANEL
          test -s build-gpio-bin/MIRA_PANEL.ino.bin
          strings build-gpio-bin/MIRA_PANEL.ino.bin | grep -Fq "0.7.14-wt32-gpio-dev5"
      - name: Package application OTA (no public release)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-wt32-gpio
          cp build-gpio-bin/MIRA_PANEL.ino.bin package-wt32-gpio/Mira_WT32_GPIO_0.7.14-wt32-gpio-dev5_OTA.bin
          sha256sum package-wt32-gpio/*.bin > package-wt32-gpio/SHA256SUMS.txt
          cat > package-wt32-gpio/README.txt <<'EOF'
          Mira WT32-SC01 Plus GPIO dev5 Multi-actions — experimental.
          Install via Système > Mise à jour manuelle with OTA application bin.
          Never use on Waveshare or Nextion. Requires Jeedom beta >= 1.2.27-beta.4 for instant feedback.
          Per-output startup policy OFF/RESTORE/ON; native ON/OFF GPIO mapping; event-driven read-only GPIO feedback.
          EXT pins: GPIO10, GPIO11, GPIO12, GPIO13, GPIO14, GPIO21.
          Electrical signals 3.3V only; do not directly drive relays/loads.
          EOF
      - name: Upload preview (not firmware release)
        uses: actions/upload-artifact@v4
        with:
          name: Mira_WT32_GPIO_web_0.7.14-dev5
          path: package-wt32-gpio/
          retention-days: 14
          if-no-files-found: error
