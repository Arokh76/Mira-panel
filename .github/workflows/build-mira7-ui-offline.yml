name: DIAGNOSTIC - Mira 7 vraies tuiles hors ligne
on:
  push:
    branches:
      - test/waveshare7-ui-offline
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI diagnostic
        uses: actions/checkout@v4
      - name: Checkout pinned LVGL 9.6.0
        uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: v9.6.0
          path: firmware/experiments/esp-idf/mira-idf-7/components/lvgl
          submodules: false
      - name: Check offline display and preservation
        shell: bash
        run: |
          set -euo pipefail
          ROOT=firmware/experiments/esp-idf/mira-idf-7
          grep -Fq 'OFFLINE_UI_READY:' "$ROOT/main/app_main.c"
          grep -Fq 'mira_full_ui_create(mira_display_lvgl())' "$ROOT/main/app_main.c"
          grep -Fq 'mira_full_storage_mount_existing_only()' "$ROOT/main/app_main.c"
          grep -Fq '.format_if_mount_failed=false' "$ROOT/main/mira_full.c"
          grep -Fq '#define LCD_BOUNCE_BUFFER_PIXELS (WIDTH * 10 * 16 / 8)' "$ROOT/main/mira_display.c"
          grep -Fq '#define LCD_PCLK_HZ (16 * 1000 * 1000)' "$ROOT/main/mira_display.c"
          ! grep -Eq 'mira_recovery_init|mira_mqtt_init|mira_jeedom_action_init|mira_camera_init|mira_full_storage_init\(' "$ROOT/main/app_main.c"
          ! grep -Eq 'nvs_flash_erase|esp_vfs_spiffs_format|esp_wifi_init' "$ROOT/main/app_main.c"
      - name: Native ESP-IDF 5.5.6 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          path: firmware/experiments/esp-idf/mira-idf-7
          command: idf.py build
      - name: Build factory USB 0x0 and OTA bins
        shell: bash
        run: |
          set -euo pipefail
          ROOT=firmware/experiments/esp-idf/mira-idf-7/build
          mkdir -p mira7_offline_ui
          cp "$ROOT/mira_idf_7std.bin" mira7_offline_ui/MIRA7_OFFLINE_UI_APP_OTA.bin
          export ROOT
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ["ROOT"])
          parts=[(0,p/"bootloader/bootloader.bin"),
                 (0x8000,p/"partition_table/partition-table.bin"),
                 (0x10000,p/"mira_idf_7std.bin")]
          out=bytearray()
          for off,part in parts:
              data=part.read_bytes()
              assert data
              limit=0x8000 if off==0 else 0x10000 if off==0x8000 else 0x310000
              assert off+len(data)<=limit
              if len(out)<off:out.extend(b"\xff"*(off-len(out)))
              out.extend(data)
          Path("mira7_offline_ui/MIRA7_OFFLINE_UI_FACTORY_USB_0x0.bin").write_bytes(out)
          PY
      - name: Upload offline UI USB factory
        uses: actions/upload-artifact@v4
        with:
          name: MIRA7_OFFLINE_UI_FACTORY_OTA
          path: mira7_offline_ui/
          retention-days: 14
          if-no-files-found: error
