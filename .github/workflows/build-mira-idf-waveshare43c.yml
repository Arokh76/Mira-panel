name: BETA Mira 4.3C ESP-IDF - build de developpement
on:
  workflow_dispatch:
  pull_request:
    branches: [firmware-beta]
    paths:
      - '.github/workflows/build-mira-idf-waveshare43c.yml'
      - 'esp-idf-4.3C/**'
  push:
    branches: [firmware-beta]
    paths:
      - '.github/workflows/build-mira-idf-waveshare43c.yml'
      - 'esp-idf-4.3C/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mira port
        uses: actions/checkout@v4
      - name: Checkout pinned Arduino baseline for 4.3C parity tests
        uses: actions/checkout@v4
        with:
          ref: 2a9811cb885698401ee0652f2033e156d122f599
          path: mira43_arduino_reference
      - name: Checkout pinned LVGL v9.6.0
        uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: v9.6.0
          path: esp-idf-4.3C/components/lvgl
          submodules: false
      - name: Verify Mira real-data safety and hardware profile
        shell: bash
        run: |
          set -euo pipefail
          ROOT=esp-idf-4.3C
          grep -Fq '#define LVGL_VERSION_MAJOR 9' "$ROOT/components/lvgl/include/lvgl/lv_version.h"
          grep -Fq 'mira_full_ui_create' "$ROOT/main/app_main.c"
          grep -Fq '/spiffs/miralvgl.json' "$ROOT/main/mira_full.c"
          grep -Fq 'format_if_mount_failed=blank' "$ROOT/main/mira_full.c"
          grep -Fq 'static bool spiffs_partition_is_blank' "$ROOT/main/mira_full.c"
          grep -Fq 'esp_partition_read(p,offset,block,n)' "$ROOT/main/mira_full.c"
          grep -Fq 'mira_jeedom_register_http(httpd);' "$ROOT/main/mira_recovery.c"
          grep -Fq 'ESP_ERROR_CHECK(mira_recovery_init())' "$ROOT/main/app_main.c"
          grep -Fq '0x610000, 0x9E0000' "$ROOT/partitions.csv"
          grep -Fq '0x310000, 0x300000' "$ROOT/partitions.csv"
          grep -Fq 'conf.max_uri_handlers = 96;' "$ROOT/main/mira_recovery.c"
          grep -Fq 'mira_beta_setup_register_captive(httpd)' "$ROOT/main/mira_recovery.c"
          grep -Fq 'mira_beta_captive_dns_start()' "$ROOT/main/mira_recovery.c"
          ! grep -Fq 'esp_vfs_spiffs_format' "$ROOT/main/mira_full.c"
      - name: Verify the beta homepage and configuration templates are unchanged
        shell: bash
        run: python3 esp-idf-4.3C/tests/check_beta_web_parity.py
      - name: Native ESP-IDF 5.5.6 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          path: esp-idf-4.3C
          command: idf.py build
      - name: Pack factory USB at 0x0 and OTA application separately
        shell: bash
        run: |
          set -euo pipefail
          ROOT=esp-idf-4.3C/build
          mkdir -p mira_idf_release
          cp "$ROOT/mira_idf_scroll.bin" mira_idf_release/Mira_43C_DEV_OTA.bin
          export ROOT
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['ROOT'])
          parts=[(0,p/'bootloader/bootloader.bin'),(0x8000,p/'partition_table/partition-table.bin'),(0x10000,p/'mira_idf_scroll.bin')]
          out=bytearray()
          for off,path in parts:
              data=path.read_bytes()
              assert len(data)>0
              limit=0x8000 if off==0 else 0x10000 if off==0x8000 else 0x310000
              assert off+len(data)<=limit
              if len(out)<off:out.extend(b'\xff'*(off-len(out)))
              out.extend(data)
          Path('mira_idf_release/Mira_43C_DEV_FACTORY_USB_0x0.bin').write_bytes(out)
          print('Factory bytes',len(out))
          PY
          test $(stat -c '%s' mira_idf_release/Mira_43C_DEV_OTA.bin) -lt 3145728
      - name: Upload build (hardware validation still required)
        uses: actions/upload-artifact@v4
        with:
          name: MIRA_43C_DEV_FACTORY_OTA
          path: mira_idf_release/
          retention-days: 14
          if-no-files-found: error
