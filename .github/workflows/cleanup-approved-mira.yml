        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const targets = JSON.parse(process.env.TARGETS);
            if (Object.keys(targets).length !== 87) throw Error("Expected 87 approved refs");
            const archive = await github.rest.repos.getBranch({owner, repo, branch:"archive/mira-preclean-20261101"});
            if (archive.data.commit.sha !== "f81703b75c52e346ce1a172760bb6134a09f4300")
              throw Error("Protected commit archive changed; no deletion");
            const current = await github.paginate(github.rest.repos.listBranches, {owner,repo,per_page:100});
            const existing = new Map(current.map(b=>[b.name,b.commit.sha]));
            for (const [name,sha] of Object.entries(targets)) {
              if (!/^(feat|feature|fix)\//.test(name)) throw Error("Unexpected protected ref "+name);
              if (existing.get(name) !== sha) throw Error("Branch changed or gone: "+name);
            }
            core.info("All 87 branch tips match archive snapshot. Beginning cleanup.");
            for (const name of Object.keys(targets)) {
              await github.rest.git.deleteRef({owner,repo,ref:"heads/"+name});
              core.info("Deleted "+name);
            }
            core.notice("Deleted exactly 87 approved branches. Archived commit remains.");
