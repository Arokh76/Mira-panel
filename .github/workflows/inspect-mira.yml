name: Inspect Mira display scheduler

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-mira.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build generated source only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf firmware/source/work
          mkdir -p firmware/source/work
          unzip -q firmware/source/Mira_Panel_Source_V0.4.3.zip -d firmware/source/work
          if [ -d firmware/overrides/MIRA_PANEL ]; then cp -a firmware/overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/; fi
          for p in current.patch ota-safety.patch v0.4.5.patch v0.4.6.patch v0.4.7.patch; do
            if [ -s "firmware/patches/$p" ]; then (cd firmware/source/work/MIRA_PANEL && patch --batch --forward -p0 < "../../../patches/$p"); fi
          done
          if [ -d firmware/final-overrides/MIRA_PANEL ]; then cp -a firmware/final-overrides/MIRA_PANEL/. firmware/source/work/MIRA_PANEL/; fi
          for s in v0.4.8.py v0.4.9.py v0.4.10.py v0.4.11.py v0.5.0.py v0.5.0_ota_sync.py v0.5.1.py v0.5.2.py v0.5.3.py v0.5.4.py v0.5.5.py v0.5.6.py v0.5.7.py v0.5.8.py v0.5.9.py v0.5.10.py v0.5.11.py v0.5.12.py v0.5.13.py; do python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL >/dev/null; done
          python3 firmware/scripts/v0.6.0_runner.py firmware/source/work/MIRA_PANEL >/dev/null
          for s in v0.6.1.py v0.6.2.py v0.6.3.py v0.6.4.py; do python3 "firmware/scripts/$s" firmware/source/work/MIRA_PANEL >/dev/null; done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('firmware/source/work/MIRA_PANEL/MiraPanelUI.cpp')
          t=p.read_text(encoding='utf-8')
          def show(sig):
              i=t.find(sig)
              print('\n===== '+sig+' =====')
              if i<0:
                  print('NOT FOUND'); return
              b=t.find('{',i); d=0
              for j in range(b,len(t)):
                  d += (t[j]=='{')-(t[j]=='}')
                  if d==0:
                      print(t[i:j+1]); return
          for sig in ['void MiraPanelUI::begin(', 'void MiraPanelUI::loop()', 'void MiraPanelUI::startNtpIfPossible()', 'void MiraPanelUI::updateClock()', 'void MiraPanelUI::refreshDisplayConfig(bool force)', 'void MiraPanelUI::updateDisplaySchedule(bool force)', 'void MiraPanelUI::applyAwakeBrightness()']:
              show(sig)
          print('\n===== TIME TOKENS =====')
          for needle in ['configTime','configTzTime','setenv','tzset','_ntpStarted','getLocalTime']:
              print('\n--',needle,'--')
              start=0
              while True:
                  i=t.find(needle,start)
                  if i<0: break
                  print(t[max(0,i-350):min(len(t),i+650)])
                  start=i+len(needle)
          PY
