<svg xmlns="http://www.w3.org/2000/svg" width="242" height="88" viewBox="80 328 1308 476" preserveAspectRatio="xMidYMid meet">
  <!-- True vector reconstruction from the validated solar panel reference image.
       Source image: panneau_solaire_bleu_en_grille_lumineuse.png (1448x1086).
       Perspective, lattice endpoints and rim follow the source coordinates.
       Keep this artwork's native 242x88 size and let firmware place it. -->
  <defs>
    <linearGradient id="solarGlass" x1="0" y1="0" x2="0.4" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#0052aa"/>
      <stop offset="1" stop-color="#00449e"/>
    </linearGradient>
    <clipPath id="solarGlassClip">
      <path d="M449,463 L1299,391 L1023,731 L173,742 Z"/>
    </clipPath>
  </defs>
  <!-- Broad bright white outer frame, preserved original perspective. -->
  <path fill="#F7FBFF" d="M413,419 Q420,414 428,414 L1365,336 Q1379,333 1382,341 Q1386,347 1376,359 L1046,773 Q1039,783 1029,783 L97,787 Q90,788 89,783 Q88,779 94,771 Z"/>
  <path fill="#001a2c" d="M426,431 L1353,354 L1027,769 L113,772 Z"/>
  <!-- Original bright cyan inner rim. -->
  <path fill="#00E8F8" d="M436,448 L1322,374 L1034,747 L153,758 Z"/>
  <path fill="url(#solarGlass)" d="M449,463 L1299,391 L1023,731 L173,742 Z"/>
  <!-- Original five slanted cell separators and three perspective rows. -->
  <g clip-path="url(#solarGlassClip)" fill="none" stroke="#F3F8FC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M569,445 L303,746"/>
    <path d="M711,432 L449,747"/>
    <path d="M856,422 L595,747"/>
    <path d="M1007,406 L742,744"/>
    <path d="M1157,394 L889,742"/>
    <path d="M375,529 L1239,469"/>
    <path d="M306,604 L1171,558"/>
    <path d="M236,679 L1102,645"/>
  </g>
</svg>
